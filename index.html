<style>
/* Layout: one narrow reading column, one decision per screen, like a page in a journal. */
:root {

:root[data-theme="dark"] {

main { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: flex; flex-direction: column; gap: 22px; }

.tabbar button { background: none; border: 0; border-radius: 10px; color: var(--ink-soft); font-weight: 600; font-size: 13px; padding: 11px 2px; line-height: 1.15; }
.tabbar button[aria-current="page"] { color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, transparent); }

@media (min-width: 700px) { .tabbar { max-width: 640px; margin: 0 auto; border: 1px solid var(--line); border-bottom: 0; border-radius: 16px 16px 0 0; } }
.aboutq { display: flex; flex-direction: column; gap: 8px; }
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; max-width: 460px; }
.seg .chipbtn { width: 100%; min-height: 44px; padding: 8px 6px; font-size: 15px; border-radius: 12px; text-align: center; line-height: 1.2; }
main:has(.fbbar) { padding-bottom: 110px; }
/* The tester box is a light card in both themes so it stands out from everything else. */

.formlist { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; }
.lifeblock { display: flex; flex-direction: column; gap: 8px; }

.arrow { padding: 4px 12px; line-height: 1.2; }

.lifecard { box-sizing: border-box; flex: 0 0 86%; max-width: 480px; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.lifecard h3 { font-size: 20px; }
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .contrast { grid-template-columns: 1fr; } }
.cbox { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.cbox.word { border-color: var(--brand); }
.namegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.namegrid .mode { padding: 12px; min-width: 0; }
.namegrid .mode .small { font-size: 12.5px; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { font-weight: 500; font-size: 14px; padding: 6px 12px; background: transparent; color: var(--ink-soft); border-color: var(--line); }
.chipbtn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.relbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.typegrid .mode .small { font-size: 12px; overflow-wrap: anywhere; }

.fric { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
.fric summary { cursor: pointer; font-weight: 700; }
.fric[open] { border-color: var(--brand); }
.fbbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: flex-end; align-items: center; gap: 6px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }

.nudge[hidden] { display: none; }
.invitebox { gap: 8px; margin-top: 6px; padding: 16px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 50%, transparent); }
.invitebox h3 { color: var(--ink); }
button.linkish { background: none; border: 0; padding: 0; border-radius: 0; color: var(--brand); font-weight: 500; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.callout { --surface: #fff; --ink: #2d2620; --ink-soft: #5f554b; --line: #e3d9cb; --brand: #6b4f2e; --brand-ink: #fffaf0; --focus: #2f5c7c;
  color-scheme: light; color: var(--ink); background: #fffaf0; border: 2px solid #d9bf94; box-shadow: 0 8px 28px rgba(201, 167, 122, .35); padding: 24px 20px; }
.callout h2 { font-size: 30px; }

.callout textarea { min-height: 130px; font-size: 16px; border: 2px solid #d9bf94; }
.callout .eyebrow { color: var(--brand); }
code.share { user-select: all; -webkit-user-select: all; display: block; font-size: 13px; word-break: break-all; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.read { max-width: 62ch; display: flex; flex-direction: column; gap: 18px; font-size: 18px; line-height: 1.7; }

.read .quote cite { display: block; font-family: var(--body); font-style: normal; font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
.read .isnt { display: flex; flex-direction: column; gap: 14px; }
.read .isnt strong { font-family: var(--display); font-weight: 400; font-size: 20px; }
.read .orn { text-align: center; color: var(--ink-soft); font-family: "Frank Ruhl Libre", serif; font-weight: 900; font-size: 30px; line-height: 1; color: var(--brand); margin: 8px 0; }

/* Save as PDF or print: light colors, no controls, tighter sizes. Small boxes stay whole;

@media print {

    --bg: #fff; --surface: #fff; --ink: #2d2620; --ink-soft: #5f554b; --line: #e3d9cb;

  main { max-width: none; padding: 0; gap: 10px; }
  header .mark { width: 30px; height: 30px; font-size: 19px; border-radius: 8px; }
  .brand { font-size: 17px; }
  h1 { font-size: 24pt; } h3 { font-size: 14pt; }
  .stack { gap: 8px; }

  .small { font-size: 9pt; }

  .printonly { display: block !important; }
  a { color: inherit; }
}
</style>

// type is still in the running.

ng team culture.", "You can recognize individual needs.", "You can encourage and develop people."], "leaderHard": [{"title": "Avoiding necessary correction", "what": "Wanting approval can keep you from confronting harmful or irresponsible behavior.", "underneath": null, "response": "Speak truth in love, remembering that accountability can be an expression of care.", "extra": [], "prayer": "Give me courage to speak truth with love.", "refs": "Ephesians 4:15"}, {"title": "Rescuing instead of developing", "what": "Repeatedly taking over others’ responsibilities can prevent growth and create unfairness.", "underneath": null, "response": "Bear appropriate burdens together while respecting personal responsibility.", "extra": [], "prayer": "Teach me when to help and when to equip.", "refs": "Galatians 6:2, 5"}], "lives": [{"who": "Martha", "sub": "Service and devotion", "text": "Martha welcomed Jesus into her home and was distracted by much serving. Jesus redirected her attention toward what mattered most. Later, she made a profound confession of faith.", "lesson": "Serving is good, but activity must never displace devotion to Christ.", "refs": "Luke 10:38–42 · John 11:27", "woman": true}, {"who": "Jonathan", "sub": "Loyal and courageous love", "text": "Jonathan loved David, supported him, and opposed Saul’s unjust treatment of him, even at personal cost.", "lesson": "Genuine love is generous and courageous. It does not require compromising truth to preserve approval.", "refs": "1 Samuel 18:1–4 · 20:30–34", "woman": false}, {"who": "Rebekah", "sub": "Generosity and deception", "text": "Rebekah demonstrated remarkable hospitality. Later, she participated in deceiving Isaac to secure Jacob’s blessing.", "lesson": "Good intentions or concern for loved ones do not justify dishonest methods.", "refs": "Genesis 24:18–20 · 27:5–17", "woman": true}, {"who": "Barnabas", "sub": "Encouragement with accountability", "text": "Barnabas generously supported believers and encouraged Paul oductivity instead of presence", "what": "You may express love by accomplishing things while neglecting emotional and relational connection.", "underneath": "A belief that usefulness establishes personal value.", "response": "Give your spouse attention that is not earned through productivity.", "extra": [], "prayer": "Lord, teach me to love through presence and service.", "refs": "Philippians 2:3–4"}, {"title": "Protecting appearances", "what": "You may minimize problems because admitting failure threatens your image.", "underneath": "Fear of shame or rejection.", "response": "Confess wrongdoing honestly and pursue genuine change rather than managing impressions.", "extra": [], "prayer": "Give me courage to walk in truth.", "refs": "Proverbs 28:13 · Ephesians 4:25"}], "parentGood": ["You can model diligence and perseverance.", "You can encourage children to develop their gifts.", "You can help children pursue meaningful goals."], "parentHard": [{"title": "Performance-based approval", "what": "Children may begin to associate your affection with achievement.", "underneath": null, "response": "Express love consistently, celebrate character, and teach that success does not determine human worth.", "extra": [], "prayer": "Help me love my children without measuring their achievements.", "refs": "Mark 10:13–16"}, {"title": "Too busy to be present", "what": "Your goals may crowd out relationships.", "underneath": null, "response": "Give children unhurried attention and model faithful stewardship of time.", "extra": [], "prayer": "Teach me to number my days wisely.", "refs": "Psalm 90:12"}], "leaderGood": ["You can establish compelling goals.", "You can recognize and develop talent.", "You can create momentum and encourage excellence."], "leaderHard": [{"title": "Treating people as instruments", "what": "Employees may become tools for achieving your goals.", "underneath": null, "response": "Remember that people bear God’s image and deserve dignity independent of their productivity.", "extra": [], "prayer": "Help me value people above my ambitions.", "refs": "Genesis 1:27 · Philippians 2:3–4"}, {"title": "Image over honesty", "what": "You may hide failures or delay acknowledging problems.", "underneath": null, "response": "Lead with transparency, accept responsibility, and correct mistakes promptly.", "extra": [], "prayer": "Make integrity more important to me than appearances.", "refs": "Proverbs 11:3"}], "lives": [{"who": "Jacob", "sub": "Striving and grace", "text": "Jacob used deception to obtain Isaac’s blessing. God nevertheless continued His covenant purposes through Jacob and later renamed him Israel.", "lesson": "God’s promises are not secured through dishonest striving.", "refs": "Genesis 27 · 28:10–15 · 32:24–30", "woman": false}, {"who": "Joseph", "sub": "Faithfulness in responsibility", "text": "Joseph served faithfully through slavery, imprisonment, and leadership in Egypt. God used his circumstances to preserve many lives.", "lesson": "Excellence can honor God when practiced with integrity, humility, and trust in His providence.", "refs": "Genesis 39 · 41 · 50:20", "woman": false}, {"who": "Solomon", "sub": "Wisdom and divided devotion", "text": "Solomon received extraordinary wisdom and built the temple. Yet his accumulation of wives and his later idolatry revealed the danger of turning away from God.", "lesson": "Accomplishment and wisdom do not replace wholehearted obedience.", "refs": "1 Kings 3 · 6 · 11:1–13", "woman": false}, {"who": "Zacchaeus", "sub": "Repentance demonstrated", "text": "Zacchaeus was a wealthy chief tax collector. After Jesus came to his home, he pledged generosity and restitution for any fraud he had committed.", "lesson": "Genuine repentance affects how we handle money, power, and responsibility.", "refs": "Luke 19:1–10", "woman": false}, {"who": "Leah", "sub": "Seen by God in her suffering", "text": "Leah lived in a marriage where she was unloved, and her suffering was real. Scripture records that the LORD saw her affliction. As her first sons were born, she named them with the longing that her husband would love her, a longing that was understandable. When her fourth son was born, she said that this time she would praise the LORD.", "lesson": "God saw Leah in her suffering. Her story reminds us that our worth is not established by another person’s approval, and that we can bring our deepest longings honestly before God.", "refs": "Genesis 29:31–35", "woman": true}, {"who": "Sarah", "sub": "Securing the promise by her own plan", "text": "God promised Abraham a son, but Sarah remained childless for many years. She gave her servant Hagar to Abraham to obtain children through her. Sarah’s attempt to secure the promised child through Hagar led to serious harm. Scripture records that Sarah treated Hagar harshly, and Hagar fled; God saw Hagar in her distress and cared for her. Later Sarah laughed at God’s promise and, out of fear, denied that she had laughed. God nevertheless remained faithful to His promise, and Sarah’s story also includes the growth of faith.", "lesson": "God’s promises are not secured by our own schemes, and our schemes can wound others. His faithfulness does not excuse wrongdoing. He keeps His word in His time.", "refs": "Genesis 16:1–13 · 18:10–15 · 21:1–7 · Hebrews 11:11", "woman": true}]}, "4": {"n": 4, "name": "Individualist", "longs": "Meaning, authenticity, connection, and being deeply understood.", "fear": "Insignificance, rejection, or being misunderstood.", "care": "Emotional attentiveness, creativity, and remembering personal details.", "brings": "Empathy, emotional honesty, depth, and creativity.", "blind": "Allowing comparison, dissatisfaction, or intense emotions to govern responses.", "conflict": "Feel misunderstood, withdraw, or intensify emotional expression.", "helps": "Patient listening combined with honest and grounded communication.", "stress": "Dismissal, superficiality, emotional disconnection, and comparison.", "supported": "Sincere attention, meaningful connection, and respectful communication.", "decides": "Personal significance, values, and emotional resonance.", "feedback": "Honest and compassionate correction that distinguishes feelings from facts.", "leads": "Communicating meaning, creativity, and personal conviction.", "values": "Authenticity, creativity, depth, and purposeful work.", "fromLeader": "Thoughtful feedback and meaningful opportunities to contribute.", "world": "Your feelings define your truth. Being authentic means following whatever feels most deeply like you.", "scripture": {"text": "Our emotions deserve honest attention, but they are not the final authority for truth. God calls believers to examine their hearts and bring their thoughts and desires before Him.", "refs": "Psalm 139:23–24 · Romans 12:2"}, "grow": "Practice gratitude, discernment, emotional self-control, and faithfulness. Allow God’s truth to guide your responses without denying genuine sorrow.", "heart": "Am I bringing my feelings before God, or allowing them to determine what is true?", "marriage": [{"title": "Feeling misunderstood", "what": "You may withdraw or intensify a conversation when you do not feel fully understood.", "underneath": "A deep desire to be known and accepted.", "response": "Communicate honestly, listen in return, and resist making perfect emotional understanding a condition of love.", "extra": [], "prayer": "Lord, help me love patiently and truthfully.", "refs": "1 Corinthians 13:4–7"}, {"title": "Focusing on what is missing", "what": "Comparison or dissatisfaction may overshadow genuine blessings.", "underneath": "Longing for deeper connection or meaning.", "response": "Practice gratitude while addressing legitimate concerns honestly.", "extra": [], "prayer": "Teach me contentment without complacency.", "refs": "Philippians 4:11–13"}], "parentGood": ["You can help children recognize and express emotions honestly.", "You can nurture creativity and individuality.", "You can demonstrate empathy during difficult experiences."], "parentHard": [{"title": "Emotions that dominate the home", "what": "Children may begin to feel responsible for managing your moods.", "underneath": null, "response": "Practice self-control and make clear that children are not responsible for regulating a parent’s emotions.", "extra": [], "prayer": "Grow gentleness and self-control in me.", "refs": "Galatians 5:22–23"}, {"title": "Withdrawing when hurt", "what": "Emotional withdrawal can leave children feeling disconnected.", "underneath": null, "response": "Take appropriate time to regain composure, then return with warmth and honest communication.", "extra": [], "prayer": "Help me remain faithful and present.", "refs": "Colossians 3:12–13"}], "leaderGood": ["You can bring meaning and creativity to work.", "You can recognize the human experience behind performance.", "You can encourage authenticity and thoughtful expression."], "leaderHard": [{"title": "Mood-driven leadership", "what": "Your emotional state may create uncertainty for others.", "underneath": null, "response": "Practice steadiness, self-control, and fair treatment regardless of your mood.", "extra": [], "prayer": "Help me lead with wisdom and self-control.", "refs": "Galatians 5:22–23"}, {"title": "Taking feedback personally", "what": "Criticism of your work may feel like rejection of your identity.", "underneath": null, "response": "Receive correction humbly and separate personal worth from performance.", "extra": [], "prayer": "Give me a teachable heart.", "refs": "Proverbs 12:1"}], "lives": [{"who": "Jeremiah", "sub": "Faithfulness through sorrow", "text": "Jeremiah faithfully proclaimed God’s message while experiencing rejection and deep anguish. His lamentations reveal the reality of suffering in faithful service.", "lesson": "Honest lament and obedience can coexist. Pain does not mean God has abandoned His servant.", "refs": "Jeremiah 1 · 20:7–18 · 31:31–34", "woman": false}, {"who": "David", "sub": "Worship, sin, and repentance", "text": "David expressed profound joy and sorrow in the Psalms. He also committed grave sins against Bathsheba and Uriah and was confronted by Nathan.", "lesson": "Emotional depth does not excuse sin. God calls us to honest confession and repentance.", "refs": "2 Samuel 11–12 · Psalm 51", "woman": false}, {"who": "Hannah", "sub": "Sorrow brought before God", "text": "Hannah suffered deeply because of infertility and mistreatment. She brought her grief to God in prayer.", "lesson": "Suffering is not a personality defect. God welcomes honest prayer from those who are hurting.", "refs": "1 Samuel 1:6–20", "woman": true}, {"who": "Naomi", "sub": "Grief and providence", "text": "Naomi endured the deaths of her husband and sons and openly expressed bitterness over her suffering. God’s providence unfolded through Ruth and Boaz.", "lesson": "God’s faithfulness is not limited by what we can understand in seasons of loss.", "refs": "Ruth 1 · 4:13–17", "woman": true}]}, "5": {"n": 5, "name": "Investigator", "longs": "Understanding, competence, privacy, and time to think.", "fear": "Being overwhelmed, unprepared, or incapable.", "care": "Offering thoughtful insight, practical assistance, and careful attention.", "brings": "Stability, thoughtful decisions, loyalty, and calm reflection.", "blind": "Using distance, analysis, or independence to avoid relational responsibility.", "conflict": "Withdraw to process information or respond with analysis before acknowledging emotions.", "helps": "Clear communication and reasonable processing time, followed by a commitment to reengage.", "stress": "Excessive demands, uncertainty, interruptions, and emotional pressure.", "supported": "Respectful boundaries, clear expectations, and thoughtful dialogue.", "decides": "Research, careful analysis, and available evidence.", "feedback": "Specific correction with an opportunity to reflect and respond.", "leads": "Expertise, preparation, and independent judgment.", "values": "Competence, thoughtfulness, preparation, and autonomy.", "fromLeader": "Clear information, appropriate independence, and reasonable expectations.", "world": "If you know enough and remain independent, you won’t need anyone. Knowledge and self-sufficiency will keep you secure.", "scripture": {"text": "Knowledge is valuable, but it must be governed by humility and love. Believers are called to use their gifts in service to others.", "refs": "1 Corinthians 8:1 · 1 Peter 4:10"}, "grow": "Let understanding lead to obedience and love. Practice generosity with your time, attention, and knowledge.", "heart": "Am I using knowledge to serve others, or to avoid depending on and loving them?", "marriage": [{"title": "Withdrawing to recharge", "what": "Solitude may be helpful, but unexplained withdrawal can leave your spouse feeling abandoned.", "underneath": "Concern about emotional or mental overload.", "response": "Communicate your need for time, agree to return, and follow through.", "extra": [], "prayer": "Lord, help me love faithfully through my presence.", "refs": "Philippians 2:4"}, {"title": "Analyzing instead of listening", "what": "You may try to solve an emotional concern before understanding it.", "underneath": "A preference for clarity and manageable problems.", "response": "Listen first, show compassion, and offer solutions when appropriate.", "extra": [], "prayer": "Make me quick to listen and slow to speak.", "refs": "James 1:19 · Romans 12:15"}], "parentGood": ["You can nurture curiosity and learning.", "You can model careful thinking.", "You can encourage children to develop sound judgment."], "parentHard": [{"title": "Being mentally absent", "what": "Children may experience you as unavailable even when you are physically nearby.", "underneath": null, "response": "Offer intentional attention and engage with their interests.", "extra": [], "prayer": "Help me be attentive to those entrusted to my care.", "refs": "Philippians 2:4"}, {"title": "Withholding affection", "what": "Children may struggle to recognize love that is rarely expressed.", "underneath": null, "response": "Demonstrate affection through appropriate words, attention, and action.", "extra": [], "prayer": "Teach me to love in deed and truth.", "refs": "1 John 3:18"}], "leaderGood": ["You can make informed decisions.", "You can remain composed under pressure.", "You can encourage independent thinking."], "leaderHard": [{"title": "Remaining distant", "what": "Your team may lack direction or encouragement because you prefer independent work.", "underneath": null, "response": "Make yourself appropriately available and communicate expectations clearly.", "extra": [], "prayer": "Help me use my gifts to serve others.", "refs": "1 Peter 4:10"}, {"title": "Withholding information", "what": "Waiting for perfect understanding may leave others unable to act.", "underneath": null, "response": "Share relevant information honestly, including what remains uncertain.", "extra": [], "prayer": "Give me wisdom to communicate truthfully.", "refs": "Ephesians 4:25"}], "lives": [{"who": "Thomas", "sub": "Questions and faith", "text": "Thomas expressed willingness to follow Jesus into danger. After the resurrection, he initially refused to believe the other disciples’ testimony without seeing Jesus himself.", "lesson": "Honest questions can be brought to Christ, but faith must ultimately respond to His truth.", "refs": "John 11:16 · 20:24–29", "woman": false}, {"who": "Nicodemus", "sub": "Seeking understanding", "text": "Nicodemus came to Jesus with questions, later spoke in favor of fair treatment, and participated in Jesus’ burial.", "lesson": "Understanding God’s truth should lead toward courageous action.", "refs": "John 3:1–21 · 7:50–51 · 19:39–40", "woman": false}, {"who": "Daniel", "sub": "Wisdom and faithfulness", "text": "Daniel demonstrated wisdom, prayerfulness, and integrity in exile. Some divine revelations left him physically overwhelmed.", "lesson": "Wisdom comes from God, and faithfulness matters even when circumstances exceed our understanding.", "refs": "Daniel 1:17–20 · 6 · 8:27", "woman": false}, {"who": "Nathanael", "sub": "Honest skepticism", "text": "Nathanael questioned whether anything good could come from Nazareth. After meeting Jesus, he confessed Him as the Son of God.", "lesson": "Initial assumptions should be surrendered when confronted with truth.", "refs": "John 1:43–51", "woman": false}, {"who": "Mary of Bethany", "sub": "Listening and devotion", "text": "Mary sat at Jesus’ feet listening to His teaching, and Jesus said she had chosen the good portion. When Lazarus died, she was mourning at home with those who came to comfort her; when she heard that Jesus was calling for her, she rose quickly, went to Him, and fell at His feet. Later she anointed Jesus with costly ointment, and Jesus connected her act with the day of His burial.", "lesson": "Listening to Jesus and bringing Him our grief and our devotion belong together.", "refs": "Luke 10:38–42 · John 11:19–20, 28–33 · John 12:1–8", "woman": true}, {"who": "Priscilla", "sub": "Knowledge used to build up", "text": "Priscilla and her husband, Aquila, heard Apollos, an eloquent teacher who knew only the baptism of John. They took him aside and explained the way of God to him more accurately. Paul later called them his fellow workers in Christ Jesus.", "lesson": "Knowledge is meant to serve others in love, not to set us above them.", "refs": "Acts 18:24–28 · Romans 16:3–4", "woman": true}, {"who": "The Queen of Sheba", "sub": "Seeking wisdom firsthand", "text": "Hearing of Solomon’s fame, the Queen of Sheba came to test him with hard questions. She said she had not believed the reports until she came and saw for herself, and she blessed the LORD. Jesus later pointed to her long journey to hear Solomon’s wisdom and said that one greater than Solomon was now present.", "lesson": "Honest inquiry is good. Its proper end is not merely knowledge but recognizing and honoring God, whose wisdom is most fully revealed in Christ.", "refs": "1 Kings 10:1–10 · Matthew 12:42", "woman": true}]}, "6": {"n": 6, "name": "Loyalist", "longs": "Security, reliability, belonging, and trustworthy relationships.", "fear": "Betrayal, abandonment, uncertainty, or being unprepared.", "care": "Preparing carefully, remaining loyal, and following through.", "brings": "Commitment, responsibility, attentiveness, and dependability.", "blind": "Allowing fear to produce suspicion, excessive reassurance-seeking, or hesitation.", "conflict": "Ask repeated questions, anticipate negative outcomes, or struggle with uncertainty.", "helps": "Honest communication, consistent behavior, and respectful attention to legitimate concerns.", "stress": "Broken promises, uncertainty, contradictory information, and unexpected changes.", "supported": "Truthfulness, reliability, clarity, and appropriate reassurance.", "decides": "Assessing risks, gathering information, and seeking wise counsel.", "feedback": "Clear, consistent correction that distinguishes facts from assumptions.", "leads": "Preparation, loyalty, responsibility, and risk awareness.", "values": "Honesty, dependability, cooperation, and commitment.", "fromLeader": "Consistency, clear expectations, and trustworthy conduct.", "world": "You must eliminate uncertainty to be safe. If you anticipate every danger, you can prevent every disappointment.", "scripture": {"text": "God calls His people to trust Him while acting with wisdom. Faith does not remove all uncertainty, and prudence is not the same as fear-driven control.", "refs": "Matthew 6:25–34 · Proverbs 3:5–6"}, "grow": "Practice courage, discernment, and faithfulness. Distinguish evidence from imagination, and refuse to let fear govern every decision.", "heart": "Am I responding to what is true, or allowing fear to decide for me?", "marriage": [{"title": "Worry and worst-case thinking", "what": "Repeatedly anticipating danger may burden your spouse or overshadow genuine blessings.", "underneath": "Desire to protect yourself and your family.", "response": "Prepare wisely, communicate concerns honestly, and entrust what you cannot control to God.", "extra": [], "prayer": "Lord, give me wisdom for today and trust for tomorrow.", "refs": "Matthew 6:34"}, {"title": "Suspicion and broken trust", "what": "Fear may lead to repeated questioning or assumptions about motives.", "underneath": "Fear of betrayal or abandonment.", "response": "Distinguish actual wrongdoing from imagined threats. Avoid false accusations and seek truth with humility.", "extra": ["When trust has genuinely been broken, rebuilding it requires honesty, repentance, and consistent changed behavior from the person responsible. Forgiveness does not require immediate trust."], "prayer": "Lord, guide me in truth, wisdom, and courage.", "refs": "Ephesians 4:25 · James 1:5"}], "parentGood": ["You can model loyalty and dependability.", "You can teach children preparation and responsibility.", "You can advocate for their safety and well-being."], "parentHard": [{"title": "Passing along fear", "what": "Children may absorb excessive anxiety about ordinary uncertainties.", "underneath": null, "response": "Teach wise caution alongside courage and trust in God.", "extra": [], "prayer": "Help me teach wisdom without cultivating fear.", "refs": "Proverbs 3:5–6"}, {"title": "Overprotecting", "what": "Attempting to prevent every difficulty can limit opportunities for growth.", "underneath": null, "response": "Provide age-appropriate guidance while allowing children to develop responsibility.", "extra": [], "prayer": "Give me wisdom to prepare and release them appropriately.", "refs": "Ephesians 6:4"}], "leaderGood": ["You can recognize risks early.", "You can build dependable systems.", "You can demonstrate loyalty and responsibility."], "leaderHard": [{"title": "Delaying decisions", "what": "Seeking complete certainty may prevent necessary action.", "underneath": null, "response": "Gather appropriate counsel, make responsible decisions, and accept that perfect certainty is rarely possible.", "extra": [], "prayer": "Lord, give me wisdom to act faithfully.", "refs": "James 1:5 · Proverbs 15:22"}, {"title": "Assuming the worst", "what": "Excessive suspicion can discourage creativity and damage trust.", "underneath": null, "response": "Evaluate ideas fairly, distinguish real risks from imagined ones, and judge others honestly.", "extra": [], "prayer": "Teach me discernment without fear-driven suspicion.", "refs": "Proverbs 18:13"}], "lives": [{"who": "Gideon", "sub": "Fear and obedience", "text": "Gideon expressed uncertainty and requested signs before leading Israel. God patiently directed him, though Gideon’s later actions also reveal serious failures.", "lesson": "God can work through fearful people, but obedience requires more than temporary courage.", "refs": "Judges 6–8", "woman": false}, {"who": "Timothy", "sub": "Faithful service", "text": "Paul praised Timothy’s genuine concern for others and encouraged him toward courage and faithful ministry.", "lesson": "Faithful service requires perseverance and reliance on God’s power rather than fear.", "refs": "Philippians 2:19–22 · 2 Timothy 1:6–8", "woman": false}, {"who": "Esther", "sub": "Courage amid real danger", "text": "Esther faced a genuine threat when approaching the king without invitation. She chose to act for her people despite the risk.", "lesson": "Courage does not require the absence of fear; it requires faithful action when obedience is costly.", "refs": "Esther 4:10–16", "woman": true}, {"who": "Joshua", "sub": "Strength and obedience", "text": "Joshua served faithfully alongside Moses and later led Israel. God repeatedly commanded him to be strong and courageous.", "lesson": "Courage is grounded in God’s faithfulness and expressed through obedience to His Word.", "refs": "Numbers 14:6–9 · Joshua 1:6–9", "woman": false}]}, "7": {"n": 7, "name": "Enthusiast", "longs": "Joy, freedom, possibility, variety, and meaningful experiences.", "fear": "Restriction, prolonged pain, missed opportunities, or being trapped.", "care": "Encouraging others, bringing energy, creating experiences, and offering optimism.", "brings": "Joy, creativity, adventure, and hopeful perspective.", "blind": "Escaping discomfort, neglecting commitments, or moving forward without addressing consequences.", "conflict": "Reframe problems positively, joke, redirect attention, or seek quick resolution.", "helps": "Honest communication that encourages perseverance rather than avoidance.", "stress": "Restriction, repetitive demands, disappointment, and prolonged uncertainty.", "supported": "Shared enjoyment, meaningful freedom, and honest partnership through difficulty.", "decides": "Possibilities, opportunities, enthusiasm, and quick judgment.", "feedback": "Truthful, direct correction that does not allow optimism to replace accountability.", "leads": "Generating ideas, encouraging people, and recognizing opportunities.", "values": "Creativity, initiative, enthusiasm, and adaptability.", "fromLeader": "Clear priorities, appropriate freedom, and opportunities to contribute ideas.", "world": "Your happiness comes first. Avoid what hurts, pursue what excites you, and don’t let commitments limit your freedom.", "scripture": {"text": "Jesus calls His followers to deny themselves, remain faithful, and find joy in Him rather than in favorable circumstances.", "refs": "Luke 9:23 · John 15:9–11 · James 1:2–4"}, "grow": "Practice perseverance, contentment, self-control, and faithfulness. Learn to remain present when love requires sacrifice.", "heart": "Am I pursuing joy in Christ, or using pleasure and distraction to avoid obedience?", "marriage": [{"title": "Avoiding difficult conversations", "what": "You may use humor, optimism, or distraction to escape uncomfortable discussions.", "underneath": "Fear of emotional pain or prolonged conflict.", "response": "Listen patiently, acknowledge wrongdoing, and remain present until the issue receives appropriate attention.", "extra": [], "prayer": "Lord, give me courage to remain faithful in difficulty.", "refs": "James 1:19 · Philippians 2:4"}, {"title": "Always pursuing the next thing", "what": "New plans may crowd out meaningful connection and unfinished responsibilities.", "underneath": "Fear of missing out or feeling confined.", "response": "Practice contentment and give your spouse your attention without constantly seeking the next experience.", "extra": [], "prayer": "Teach me contentment and faithfulness today.", "refs": "Philippians 4:11–13"}], "parentGood": ["You can nurture joy, wonder, and gratitude.", "You can encourage creativity and exploration.", "You can help children see possibilities and approach challenges with hope."], "parentHard": [{"title": "Rushing past sadness", "what": "Children may feel pressured to become happy before their emotions have been heard.", "underneath": null, "response": "Listen compassionately and allow space for grief without abandoning hope.", "extra": [], "prayer": "Teach me to weep with those who weep.", "refs": "Romans 12:15 · John 11:35"}, {"title": "Inconsistent follow-through", "what": "Excitement about new experiences may interfere with promises and routines.", "underneath": null, "response": "Keep commitments and model perseverance in ordinary responsibilities.", "extra": [], "prayer": "Grow faithfulness and self-control in me.", "refs": "Galatians 5:22–23"}], "leaderGood": ["You can inspire optimism and initiative.", "You can identify opportunities.", "You can cultivate creativity and energy."], "leaderHard": [{"title": "Too many unfinished ideas", "what": "Frequent changes can create confusion, wasted effort, and instability.", "underneath": null, "response": "Count the cost, establish priorities, and finish what you responsibly commit to doing.", "extra": [], "prayer": "Teach me to plan wisely and follow through.", "refs": "Luke 14:28–30"}, {"title": "Avoiding hard conversations", "what": "You may postpone correction to preserve an upbeat atmosphere.", "underneath": null, "response": "Address problems promptly, truthfully, and lovingly.", "extra": [], "prayer": "Give me courage to speak truth in love.", "refs": "Ephesians 4:15"}], "lives": [{"who": "Peter", "sub": "Zeal, failure, and restoration", "text": "Peter responded boldly to Jesus, confessed Him as the Christ, and also resisted Jesus’ teaching about suffering. He later denied knowing Jesus and was restored by Him.", "lesson": "Enthusiasm is not a substitute for obedience. Christ calls us to faithfulness even when following Him is costly.", "refs": "Matthew 16:16–23 · Luke 22:54–62 · John 21:15–19", "woman": false}, {"who": "John Mark", "sub": "Departure and renewed usefulness", "text": "John Mark accompanied Paul and Barnabas but returned to Jerusalem during their journey. Scripture does not explain his reason. Paul later considered him useful for ministry.", "lesson": "A past failure or disagreement need not define someone’s future faithfulness.", "refs": "Acts 13:13 · 15:37–39 · 2 Timothy 4:11", "woman": false}, {"who": "Samson", "sub": "Strength without consistent obedience", "text": "God gave Samson extraordinary strength, yet Scripture records repeated destructive choices and serious moral failures.", "lesson": "Gifts and abilities never excuse disobedience. Strength without self-control can bring devastating consequences.", "refs": "Judges 13–16 · Hebrews 11:32", "woman": false}, {"who": "Miriam", "sub": "Worship and correction", "text": "Miriam led Israel’s women in celebration after the crossing of the sea. Later, she and Aaron spoke against Moses and were confronted by God.", "lesson": "Joyful worship and meaningful service must remain joined to humility and obedience.", "refs": "Exodus 15:20–21 · Numbers 12:1–15", "woman": true}]}, "8": {"n": 8, "name": "Challenger", "longs": "Independence, honesty, strength, and the ability to protect others.", "fear": "Betrayal, vulnerability, powerlessness, or unjust control.", "care": "Advocating, protecting, confronting problems, and taking responsibility.", "brings": "Courage, loyalty, decisiveness, and willingness to face difficult situations.", "blind": "Allowing strength to become domination, intimidation, anger, or resistance to correction.", "conflict": "Confront problems directly, speak forcefully, or expect others to respond with similar intensity.", "helps": "Honest communication, appropriate boundaries, and mutual accountability.", "stress": "Dishonesty, manipulation, powerlessness, and perceived injustice.", "supported": "Truthfulness, mutual respect, and freedom from manipulation.", "decides": "Conviction, rapid assessment, and decisive action.", "feedback": "Direct correction can be useful, but humility requires receiving truth even when it is delivered gently.", "leads": "Making decisions, confronting problems, and advocating for others.", "values": "Honesty, competence, initiative, and courage.", "fromLeader": "Clear communication, fairness, and appropriate responsibility.", "world": "Strength means control. Never appear weak, never back down, and make sure no one has power over you.", "scripture": {"text": "Jesus demonstrates strength through humility, gentleness, obedience, and sacrificial service. Authority is entrusted for the good of others, not personal domination.", "refs": "Mark 10:42–45 · Matthew 11:29"}, "grow": "Practice gentleness, humility, patience, and self-control. Use strength to defend others rather than control them.", "heart": "Am I using my strength to serve and protect, or to make others submit to my will?", "marriage": [{"title": "Intensity that overwhelms", "what": "Forceful communication may silence or intimidate your spouse, regardless of your intentions.", "underneath": "Fear of vulnerability, dishonesty, or losing control.", "response": "Listen without interrupting, exercise self-control, and take responsibility for the impact of your behavior. Intimidation is not a personality style; it is sin. If your spouse is afraid of you, stop, make sure they are safe, and get help from a qualified counselor. Pastoral care may provide additional support.", "extra": [], "prayer": "Jesus, gentle and lowly, teach me Your way.", "refs": "Matthew 11:29 · James 1:19"}, {"title": "Hiding vulnerability", "what": "You may respond to hurt with anger, defensiveness, or emotional distance.", "underneath": "Fear that vulnerability means weakness.", "response": "Speak honestly about pain without using anger to control others.", "extra": [], "prayer": "Lord, give me humility to speak truthfully.", "refs": "Ephesians 4:25–26"}], "parentGood": ["You can teach courage and responsibility.", "You can defend children against injustice.", "You can model decisive action and conviction."], "parentHard": [{"title": "Harshness or intimidation", "what": "Children may comply out of fear rather than learn wisdom and obedience.", "underneath": null, "response": "Correct with patience and self-control. Never confuse intimidation with godly authority.", "extra": [], "prayer": "Make me gentle and faithful in correction.", "refs": "Ephesians 6:4"}, {"title": "Controlling every decision", "what": "A desire to protect may prevent children from developing discernment.", "underneath": null, "response": "Provide appropriate boundaries while allowing age-appropriate responsibility.", "extra": [], "prayer": "Give me wisdom to guide without dominating.", "refs": "Colossians 3:21"}], "leaderGood": ["You can make difficult decisions.", "You can advocate for people treated unfairly.", "You can accept responsibility in challenging circumstances."], "leaderHard": [{"title": "Steamrolling others", "what": "Your intensity may discourage disagreement and prevent important concerns from being heard.", "underneath": null, "response": "Invite honest input, listen carefully, and exercise authority as a servant.", "extra": [], "prayer": "Make me quick to listen and humble in leadership.", "refs": "James 1:19 · Mark 10:42–45"}, {"title": "Refusing to acknowledge weakness", "what": "A need to appear strong may make it difficult to admit mistakes.", "underneath": null, "response": "Confess wrongdoing, receive correction, and model humility.", "extra": [], "prayer": "Give me courage to acknowledge my failures.", "refs": "Proverbs 28:13"}], "lives": [{"who": "Moses", "sub": "Leadership, humility, and disobedience", "text": "Moses confronted Pharaoh and led Israel, yet Scripture also records serious wrongdoing, including killing an Egyptian and disobeying God’s command at the rock.", "lesson": "Great responsibility requires humility and obedience. Authority does not place anyone beyond correction.", "refs": "Exodus 2:11–15 · Numbers 12:3 · 20:7–12", "woman": false}, {"who": "Nehemiah", "sub": "Courageous leadership", "text": "Nehemiah organized the rebuilding of Jerusalem’s walls, confronted injustice, and resisted opposition. His forceful actions also invite careful examination rather than automatic imitation.", "lesson": "Courageous leadership must remain accountable to God’s righteousness.", "refs": "Nehemiah 2 · 5 · 13:23–27", "woman": false}, {"who": "John, son of Zebedee", "sub": "Zeal redirected", "text": "John and James were called Sons of Thunder. They sought positions of honor and once wanted judgment against a Samaritan village. Jesus corrected their understanding of greatness and authority.", "lesson": "Zeal must be governed by the humility and love of Christ.", "refs": "Mark 3:17 · 10:35–45 · Luke 9:51–56", "woman": false}, {"who": "Deborah", "sub": "Faithful courage", "text": "Deborah served as a prophetess and judge, delivered God’s instruction, and participated in Israel’s deliverance.", "lesson": "Courage and authority can be exercised faithfully in service to God’s purposes. The text does not identify her strength as a flaw.", "refs": "Judges 4–5", "woman": true}]}, "9": {"n": 9, "name": "Peacemaker", "longs": "Harmony, stability, connection, and freedom from unnecessary conflict.", "fear": "Separation, rejection, tension, or relational disruption.", "care": "Listening, accommodating, remaining patient, and helping others cooperate.", "brings": "Steadiness, patience, acceptance, and thoughtful listening.", "blind": "Avoiding necessary confrontation, withholding honest opinions, or becoming passive.", "conflict": "Withdraw, agree prematurely, or delay difficult conversations.", "helps": "Respectful invitations to speak honestly and reasonable time to consider decisions.", "stress": "Pressure, hostility, rushed decisions, and unresolved tension.", "supported": "Respectful dialogue, clear expectations, and opportunities to contribute.", "decides": "Considering multiple perspectives and seeking agreement.", "feedback": "Clear, patient correction that encourages truthful engagement rather than withdrawal.", "leads": "Building consensus, listening, and creating stability.", "values": "Cooperation, harmony, fairness, and mutual respect.", "fromLeader": "Clear priorities, respectful communication, and meaningful opportunities for input.", "world": "Peace means avoiding conflict. Keep everyone happy, even if it means remaining silent about what is wrong.", "scripture": {"text": "Jesus blesses peacemakers, not merely conflict avoiders. Biblical peace is grounded in truth and righteousness, and it seeks reconciliation as far as it depends on us. It never requires hiding wrongdoing or tolerating harm.", "refs": "Matthew 5:9 · Ephesians 4:15 · Romans 12:18"}, "grow": "Practice courage, honesty, responsibility, and active peacemaking. Speak truth even when it creates temporary discomfort.", "heart": "Am I pursuing genuine peace, or avoiding the cost of doing what is right?", "marriage": [{"title": "Peace at any price", "what": "You may agree outwardly while withholding disagreement or quietly resisting.", "underneath": "Fear of conflict or disconnection.", "response": "Speak honestly and pursue genuine peace rather than superficial agreement. Peace never requires staying silent about mistreatment.", "extra": [], "prayer": "Lord, make me a peacemaker who walks in truth.", "refs": "Matthew 5:9 · Ephesians 4:25"}, {"title": "Losing your voice", "what": "Continually accommodating others may prevent honest participation in important decisions.", "underneath": "Fear that disagreement threatens love.", "response": "Express convictions humbly and listen with equal care.", "extra": [], "prayer": "Give me courage to speak truth in love.", "refs": "Ephesians 4:15"}], "parentGood": ["You can model patience and calm.", "You can help children resolve disagreements.", "You can create a welcoming and supportive home."], "parentHard": [{"title": "Avoiding necessary discipline", "what": "Discomfort with conflict may lead you to neglect correction.", "underneath": null, "response": "Provide consistent, loving discipline and teach children responsibility.", "extra": [], "prayer": "Help me correct faithfully and lovingly.", "refs": "Ephesians 6:4"}, {"title": "Disengaging from responsibility", "what": "Withdrawal into routines, distractions, or passive habits may reduce meaningful connection.", "underneath": null, "response": "Be attentive and intentional with your children.", "extra": [], "prayer": "Teach me to use my time faithfully.", "refs": "Ephesians 5:15–16"}], "leaderGood": ["You can help people feel heard.", "You can promote cooperation.", "You can bring stability during conflict."], "leaderHard": [{"title": "Avoiding necessary confrontation", "what": "Unresolved problems may harm employees and weaken trust.", "underneath": null, "response": "Address wrongdoing fairly, promptly, and truthfully.", "extra": [], "prayer": "Make me a peacemaker, not merely a peacekeeper.", "refs": "Matthew 5:9 · Ephesians 4:15"}, {"title": "Delaying decisions", "what": "Waiting for universal agreement may leave others without direction.", "underneath": null, "response": "Seek wise counsel, accept responsibility, and make appropriate decisions.", "extra": [], "prayer": "Guide me in wisdom and faithful action.", "refs": "Proverbs 15:22"}], "lives": [{"who": "Abraham", "sub": "Peace and costly failures", "text": "Abraham sought peace with Lot by allowing him to choose land. Scripture also records occasions when Abraham misrepresented Sarah as his sister, exposing her to danger.", "lesson": "Seeking peace is good, but fear and deception are not acceptable means of obtaining it.", "refs": "Genesis 13:8–12 · 12:10–20 · 20", "woman": false}, {"who": "Aaron", "sub": "Support and compromise", "text": "Aaron assisted Moses and later served as high priest. When pressured by the people, he participated in making the golden calf.", "lesson": "Yielding to pressure can become serious disobedience. Faithfulness requires courage.", "refs": "Exodus 17:10–13 · 32:1–24", "woman": false}, {"who": "Isaac", "sub": "Peacefulness and family conflict", "text": "Isaac repeatedly moved rather than fight over disputed wells. His family also experienced favoritism and deception.", "lesson": "Peacefulness is valuable, but family relationships require truthfulness and responsible leadership.", "refs": "Genesis 25:28 · 26:17–22 · 27", "woman": false}, {"who": "Eli", "sub": "The cost of failing to correct", "text": "Eli instructed Samuel in recognizing God’s call, but Scripture explicitly condemns his failure to restrain his sons.", "lesson": "Avoiding necessary correction can cause serious harm. Love and leadership require responsibility.", "refs": "1 Samuel 2:22–36 · 3:8–14", "woman": false}, {"who": "Abigail", "sub": "Courageous peacemaking", "text": "When her husband, Nabal, insulted David, David set out to take revenge. Abigail acted quickly, brought provisions, humbly appealed to David, and urged him not to take vengeance into his own hands. David blessed God for her good judgment. Afterward she told Nabal what had happened.", "lesson": "Biblical peacemaking is active and courageous. It turns people away from sin rather than simply avoiding conflict.", "refs": "1 Samuel 25:2–42", "woman": true}, {"who": "The wise woman of Abel", "sub": "Peace through wise words", "text": "When Joab besieged the city of Abel to capture Sheba, a man who had rebelled against King David, a wise woman called out to Joab and reasoned with him not to destroy a faithful city. She then persuaded the people of the city, who put the rebel to death, and Joab withdrew. Scripture records this outcome without presenting it as a model for every conflict.", "lesson": "Wise, courageous words can turn aside destruction and spare many lives. Peacemaking may require speaking up and reasoning carefully.", "refs": "2 Samuel 20:14–22", "woman": true}]}}, "twoNote": "These prayers may rotate across spouse pairings. They are original, Scripture-inspired prayers, not quotations from the Bible. They assume both spouses are seeking to love one another; if you are being harmed, see Relationship safety. No prayer here asks you to remain in danger.", "couple": [{"theme": "Love", "in": "Lord, clothe us in love.", "out": "Teach us to serve one another.", "refs": "Colossians 3:12–14"}, {"theme": "Humility", "in": "Give us humble hearts.", "out": "Help us consider one another.", "refs": "Philippians 2:3–4"}, {"theme": "Reconciliation", "in": "Make us truthful and gentle.", "out": "Lead us toward genuine peace.", "refs": "Ephesians 4:2–3, 15"}, {"theme": "Faithfulness", "in": "Teach us patient love.", "out": "Help us remain faithful.", "refs": "1 Corinthians 13:4–7"}, {"theme": "Marriage", "in": "Help us honor our covenant.", "out": "Teach us to love sacrificially.", "refs": "Genesis 2:24 · Ephesians 5:1–2"}], "pairing": {"same": ["You may recognize similar desires, tendencies, and struggles in one another. That familiarity can encourage understanding, but it may also mean sharing blind spots.", "Your shared personality patterns do not guarantee harmony. Christ calls both of you to humility, truthfulness, repentance, and sacrificial love."], "center": ["Within the Enneagram framework, your types belong to the same center: gut, heart, or head.", "This framework suggests that you may approach certain concerns in related ways, even when your responses differ. These categories are tools for reflection, not biblical identities or fixed psychological laws."], "different": ["You may approach decisions, emotions, and conflict differently. These differences can create misunderstandings, but they can also provide opportunities to practice patience, humility, and love.", "Your shared calling is not to become more alike in personality, but to grow in Christlike character."], "yada": {"paras": ["The Hebrew word yada broadly means “to know.” Depending on context, it can describe knowledge, recognition, or deeply personal relationship.", "Scripture calls believers to know God and to love one another sincerely. Understanding someone’s personality can support that love, but genuine love also requires truth, faithfulness, responsibility, and action."], "refs": "John 17:3 · 1 John 3:18"}}, "safety": [". No prayer here asks you to remain in danger.", "Love", "Breathe in: Lord, clothe us in love.\nBreathe out: Teach us to serve one another.\nColossians 3:12–14", "Humility", "Breathe in: Give us humble hearts.\nBreathe out: Help us consider one another.\nPhilippians 2:3–4", "Reconciliation", "Breathe in: Make us truthful and gentle.\nBreathe out: Lead us toward genuine peace.\nEphesians 4:2–3, 15", "Faithfulness", "Breathe in: Teach us patient love.\nBreathe out: Help us remain faithful.\n1 Corinthians 13:4–7", "Marriage", "Breathe in: Help us honor our covenant.\nBreathe out: Teach us to love sacrificially.\nGenesis 2:24 · Ephesians 5:1–2"], "work": {"note": "These principles apply regardless of Enneagram type.", "leader": {"paras": ["Authority is a responsibility entrusted for the good of others, not permission to dominate.", "Christ calls leaders toward humility, honesty, justice, self-control, and service."], "refs": "Mark 10:42–45 · Philippians 2:3–5"}, "employer": {"paras": ["Treat workers fairly. Communicate honestly, compensate justly, avoid favoritism, and exercise authority responsibly.", "Employees bear God’s image and must never be reduced to their usefulness or productivity."], "refs": "Colossians 4:1 · James 5:4 · James 2:1–9"}, "employee": {"paras": ["Work diligently and honestly. Receive appropriate correction, fulfill responsibilities, and communicate truthfully.", "Respect for authority does not require participating in wrongdoing or accepting abuse."], "refs": "Colossians 3:23–24 · Ephesians 4:25 · Acts 5:29"}, "calling": {"paras": ["Whatever our personality or position, we are called to love God and our neighbors.", "We do not measure righteousness by personality, productivity, popularity, authority, or personal comfort.", "We look to Jesus Christ, who calls us to follow Him."], "refs": "Matthew 22:37–40 · Luke 9:23"}}, "names": {"1": {"default": "Reformer", "options": [{"id": "reformer", "name": "Reformer", "about": "May identify with recognizing problems and wanting things to improve."}, {"id": "perfectionist", "name": "Perfectionist", "about": "May recognize high standards and close attention to mistakes."}, {"id": "idealist", "name": "Idealist", "about": "May emphasize principles and a picture of how things ought to be."}, {"id": "improver", "name": "Improver", "about": "May identify with refining processes, practices, or circumstances."}, {"id": "advocate", "name": "Advocate", "about": "May be drawn to standing up for principles or addressing perceived unfairness."}], "reflection": {"question": "Do my convictions lead me toward justice, mercy, and humility, or do I sometimes use them to elevate myself above others?", "refs": "Micah 6:8; Philippians 2:3–4"}}, "2": {"default": "Helper", "options": [{"id": "helper", "name": "Helper", "about": "May identify with offering practical assistance."}, {"id": "giver", "name": "Giver", "about": "May emphasize generosity and meeting others’ needs."}, {"id": "caregiver", "name": "Caregiver", "about": "May recognize attentiveness to another person’s well-being."}, {"id": "nurturer", "name": "Nurturer", "about": "May identify with encouragement and supportive relationships."}, {"id": "connector", "name": "Connector", "about": "May emphasize helping people build relationships and feel included."}], "reflection": {"question": "Am I loving others sincerely, or am I sometimes seeking approval, recognition, or influence through what I give?", "refs": "Philippians 2:3–4; 1 John 3:18"}}, "3": {"default": "Achiever", "options": [{"id": "achiever", "name": "Achiever", "about": "May identify with setting and accomplishing goals."}, {"id": "performer", "name": "Performer", "about": "May recognize attentiveness to presentation and expectations."}, {"id": "motivator", "name": "Motivator", "about": "May enjoy encouraging effort and progress."}, {"id": "striver", "name": "Striver", "about": "May identify with ambition, persistence, and hard work."}, {"id": "builder", "name": "Builder", "about": "May emphasize creating or developing something meaningful."}], "reflection": {"question": "Am I stewarding my abilities faithfully, or am I allowing achievement and recognition to become the basis of my worth?", "refs": "Philippians 3:7–9; Ephesians 2:8–10"}}, "4": {"default": "Individualist", "options": [{"id": "individualist", "name": "Individualist", "about": "May identify with personal distinctiveness."}, {"id": "romantic", "name": "Romantic", "about": "May emphasize emotional depth, meaning, and longing."}, {"id": "artist", "name": "Artist", "about": "May identify with creative or expressive interests."}, {"id": "creative", "name": "Creative", "about": "May recognize imagination and originality."}, {"id": "original", "name": "Original", "about": "May value expressing what feels authentic and personally meaningful."}], "reflection": {"question": "Am I honestly bringing my feelings and desires before God, while allowing His truth to guide how I respond?", "refs": "Psalm 139:23–24; Romans 12:2"}, "caution": "Grief, longing, and emotional depth are not inherently sinful."}, "5": {"default": "Investigator", "options": [{"id": "investigator", "name": "Investigator", "about": "May identify with researching and understanding."}, {"id": "observer", "name": "Observer", "about": "May prefer careful attention before acting."}, {"id": "thinker", "name": "Thinker", "about": "May recognize a reflective, analytical approach."}, {"id": "analyst", "name": "Analyst", "about": "May enjoy examining complex problems."}, {"id": "sage", "name": "Sage", "about": "May be drawn to the pursuit of wisdom and understanding; choosing this name does not establish that the person possesses biblical wisdom."}], "reflection": {"question": "Am I using what I know to love and serve others, or allowing knowledge to become a source of pride or distance?", "refs": "1 Corinthians 8:1; James 3:13–18"}}, "6": {"default": "Loyalist", "options": [{"id": "loyalist", "name": "Loyalist", "about": "May identify with commitment and dependability."}, {"id": "guardian", "name": "Guardian", "about": "May emphasize preparation and concern for safety."}, {"id": "skeptic", "name": "Skeptic", "about": "May recognize a habit of questioning assumptions."}, {"id": "questioner", "name": "Questioner", "about": "May seek clarity before deciding or trusting."}, {"id": "defender", "name": "Defender", "about": "May value standing beside people or convictions."}], "reflection": {"question": "Am I exercising discernment with wisdom and faith, or allowing unfounded fear or suspicion to govern my actions?", "refs": "James 1:5; Matthew 6:25–34"}, "caution": "Caution and distrust can be warranted when someone has been harmed or deceived. Do not pressure users to trust unsafe people."}, "7": {"default": "Enthusiast", "options": [{"id": "enthusiast", "name": "Enthusiast", "about": "May identify with energy, enjoyment, and anticipation."}, {"id": "visionary", "name": "Visionary", "about": "May emphasize imagining future possibilities and generating ideas."}, {"id": "adventurer", "name": "Adventurer", "about": "May enjoy new experiences and exploration."}, {"id": "optimist", "name": "Optimist", "about": "May tend to look for hopeful possibilities."}, {"id": "explorer", "name": "Explorer", "about": "May emphasize curiosity and discovering unfamiliar things."}], "reflection": {"question": "Am I using my enthusiasm and imagination faithfully, or pursuing new possibilities to avoid responsibilities God has placed before me?", "refs": "Luke 9:23; Galatians 5:22–23"}, "caution": "Imagination is not the same as wisdom, and enjoyment is not inherently sinful."}, "8": {"default": "Challenger", "options": [{"id": "challenger", "name": "Challenger", "about": "May identify with confronting problems directly."}, {"id": "protector", "name": "Protector", "about": "May value defending people or standing against perceived threats; the name does not prove that the person’s actions are protective."}, {"id": "leader", "name": "Leader", "about": "May recognize a tendency to take initiative or assume responsibility; the name does not establish leadership competence or authority."}, {"id": "asserter", "name": "Asserter", "about": "May identify with direct communication and strong convictions."}, {"id": "maverick", "name": "Maverick", "about": "May value independence and freedom to make decisions."}], "reflection": {"question": "Am I using strength to serve others, or am I sometimes using it to control, intimidate, or avoid correction?", "refs": "Mark 10:42–45; James 1:19–20"}}, "9": {"default": "Peacemaker", "options": [{"id": "peacemaker", "name": "Peacemaker", "about": "May identify with seeking reconciliation and harmony."}, {"id": "mediator", "name": "Mediator", "about": "May enjoy helping people understand differing perspectives."}, {"id": "harmonizer", "name": "Harmonizer", "about": "May prefer cooperation and stability."}, {"id": "diplomat", "name": "Diplomat", "about": "May identify with tact and careful communication."}, {"id": "peacekeeper", "name": "Peacekeeper", "about": "May recognize a desire to prevent or reduce conflict."}], "reflection": {"question": "Am I pursuing peace grounded in truth and love, or avoiding conversations and responsibilities that require courage?", "refs": "Matthew 5:9; Ephesians 4:15; Galatians 6:1"}, "caution": "Genuine peacemaking is not the same as avoiding conflict."}}, "formation": {"sections": [{"title": "If you’re exploring", "paras": ["You’re welcome here, whatever you believe. These pages describe what following Jesus means for people who trust Him. Where they speak to Christians, you can read them as a picture of what Jesus offers and asks. The best place to start is reading about Jesus Himself, in one of the Gospels, such as Mark or John."], "refs": null, "group": null}, {"title": "Savior, Teacher, and Lord", "paras": ["Jesus is Savior, Teacher, and Lord. These aren’t separate roles we grant Him one at a time. They are all true of who He is.", {"list": [{"term": "Savior", "text": "We depend on His saving grace, not on our own righteousness."}, {"term": "Teacher", "text": "We listen to His teaching and learn to practice what He commands."}, {"term": "Lord", "text": "We acknowledge His authority over every part of life: our relationships, habits, decisions, priorities, desires, and conduct."}]}, "Obedience doesn’t earn salvation. But the same grace that saves us also trains us to live differently. Every believer still obeys imperfectly, which is why we keep returning to His grace and keep following Him."], "refs": "Luke 6:46 · Matthew 28:18–20 · John 14:15 · Titus 2:11–14 · Ephesians 2:8–10", "group": null}, {"title": "How growth happens", "paras": ["The Holy Spirit is the one who transforms us. We don’t produce change through willpower.", "But we are not passive. We respond through faith, repentance, obedience, spiritual practices, and life with other believers.", "Growth is often gradual. Continuing to face temptation doesn’t necessarily mean you are failing. Resisting temptation is itself faithfulness.", "Growth isn’t only a list of things to do. Sometimes the faithful response is to act. Sometimes it is to stop, to confess, to receive help, or to rest. We also learn to receive: God’s grace, forgiveness, and love; help and correction from others; rest, joy, community, and ordinary good gifts. Receiving is not the opposite of faithfulness.", "The goal is love. Spiritual maturity is not measured by how many religious practices we complete. As the Holy Spirit transforms us, we seek to become people who increasingly love God and love others as Jesus teaches. Without love, even impressive spiritual activity amounts to nothing."], "refs": "2 Corinthians 3:18 · Romans 8:12–13 · Galatians 5:16–25 · Philippians 2:12–13 · John 15:4–5 · Matthew 22:37–40 · John 13:34–35 · 1 Corinthians 13:1–7", "group": null}, {"title": "Our stories", "paras": ["What am I believing about God, myself, or others? We all carry stories that shape how we live, often without noticing them. For example:", {"list": [{"term": null, "text": "I must accomplish enough to be valuable."}, {"term": null, "text": "If I can’t control something, I can’t be safe."}, {"term": null, "text": "If someone disagrees with me, they are rejecting me."}, {"term": null, "text": "If I disappoint someone, I have failed."}, {"term": null, "text": "If life becomes uncomfortable, I must escape."}]}, "These aren’t assigned to any personality type, and you may not believe any of them. If one sounds familiar, compare it with what Scripture actually says, read in its context, and ask God to bring your thinking under His truth."], "refs": "Romans 12:2 · John 8:31–32", "group": "What forms us"}, {"title": "Our habits", "paras": ["What repeated habits might be reinforcing a pattern in my life? Consider your habits around technology, entertainment, work, spending, communication, rest, relationships, prayer, Scripture, and time with other believers.", "Everyday routines shape what we pay attention to and what we come to love. Not every routine needs a religious purpose. The question is whether our habits are helping or hindering our love for God and others."], "refs": "1 Timothy 4:7–8 · 1 Corinthians 6:12", "group": "What forms us"}, {"title": "Our loves", "paras": ["Good things can take the wrong place in our lives. For example:", {"list": [{"term": null, "text": "Food is good, but appetite can become controlling."}, {"term": null, "text": "Work is good, but achievement can push out other responsibilities."}, {"term": null, "text": "Rest is good, but leisure can sometimes be used to avoid obligations."}, {"term": null, "text": "Helping others is good, but service can become a way to win approval or keep control."}, {"term": null, "text": "Knowledge is good, but learning can become a substitute for obedience."}, {"term": null, "text": "Peace is good, but keeping things comfortable can become an excuse for withholding needed truth."}]}, "Enjoyment, appetite, ambition, and leisure are not sinful in themselves. The question is whether a good thing has begun to rule us or to crowd out our love for God and neighbor."], "refs": "Matthew 22:37–39 · 1 Corinthians 10:31", "group": "What forms us"}, {"title": "What we leave undone", "paras": ["Sin is not only doing what is wrong. It can also be knowingly failing to do what is right. James writes this after warning people who make confident plans without regard for God: whoever knows the right thing to do and fails to do it, sins.", {"list": [{"term": null, "text": "Neglecting responsibilities."}, {"term": null, "text": "Withholding help that is needed and that we are able to give."}, {"term": null, "text": "Refusing to speak the truth when it is appropriate."}, {"term": null, "text": "Avoiding reconciliation when it is safe and appropriate."}, {"term": null, "text": "Passing by opportunities to love and serve."}]}, "This is different from exhaustion, illness, disability, limited capacity, or competing obligations that are also legitimate. Not every choice between two good things is a sin.", "Self-examination should lead us toward God and faithful living, not endless analysis of ourselves. Negative emotions, preferences, desires, tiredness, disagreements, personal limits, and things we enjoy are not, by themselves, signs of spiritual failure. Look honestly, then turn toward Christ: trust Him, repent where it is needed, obey, love, give thanks, lean on others, and rest."], "refs": "James 4:13–17 · Psalm 139:23–24 · Hebrews 12:1–2", "group": "What forms us"}, {"title": "Rest, Sabbath, and celebration", "paras": ["Rest is a good gift from God. We don’t earn it by being productive. It isn’t laziness, and it isn’t only a way to get ready for more work.", "God rested on the seventh day and blessed it. He gave Israel the Sabbath as a gift and a reminder that they were no longer slaves. Jesus taught that the Sabbath was made for people, and He invites the weary to come to Him for rest.", {"list": [{"term": "Rest", "text": "Receiving restoration and enjoyment, such as sleep, recreation, time with people we love, solitude, and gratitude, while trusting God with our limits."}, {"term": "Sabbath", "text": "Intentionally setting apart time for rest, worship, delight, and attention to God."}, {"term": "Avoidance", "text": "Using an activity, including leisure, to knowingly escape a responsibility."}]}, "Resting is not automatically avoidance, and working is not automatically virtue. Christians differ in how they understand and observe Sabbath under the new covenant. Whatever our tradition, rest should not become another measure of spiritual superiority. If you have young children, care for others, work demanding hours, or live with illness or disability, rest may come in small pieces, and uninterrupted rest may be rare. That doesn’t make you spiritually behind, and Sabbath is not another performance requirement.", "Food, family, friendship, beauty, laughter, and recreation can be enjoyed with gratitude. Rest doesn’t have to be productive to be worthwhile."], "refs": "Genesis 2:2–3 · Exodus 20:8–11 · Deuteronomy 5:12–15 · Mark 2:27 · Matthew 11:28–30 · 1 Timothy 4:4–5", "group": null}, {"title": "Practices that make room for God", "paras": ["Spiritual practices don’t earn God’s favor. They are ways of making room for His transforming work.", {"list": [{"term": "Prayer", "text": "Talking with God honestly and listening for Him."}, {"term": "Scripture", "text": "Reading, studying, and remembering God’s Word, in its context."}, {"term": "Solitude and silence", "text": "Stepping away from noise to be attentive to God."}, {"term": "Simplicity", "text": "Loosening our grip on possessions, busyness, and the need to impress."}, {"term": "Service", "text": "Doing good for others quietly, without needing to be noticed."}, {"term": "Confession", "text": "Naming sin honestly to God, and where wise, to a trusted believer."}, {"term": "Worship", "text": "Gathering with God’s people to honor Him."}, {"term": "Fellowship", "text": "Sharing life with other believers."}, {"term": "Celebration", "text": "Enjoying God’s goodness with joy and gratitude."}]}, "A practice never replaces obedience. If something is harming others, stopping it comes first. And no practice guarantees a particular result. Growth is God’s work, and He works in His time."], "refs": "1 Timothy 4:7–8 · Matthew 6:5–6 · James 5:16 · Philippians 4:4", "group": null}, {"title": "Not meant to be alone", "paras": ["Spiritual growth isn’t meant to happen in isolation, and no app can replace a church family. Where you can, look for:", {"list": [{"term": null, "text": "A local church where you can worship and belong."}, {"term": null, "text": "Trusted Christian friends."}, {"term": null, "text": "A mentor or pastor who can offer guidance."}, {"term": null, "text": "Accountability with people who have shown they are safe."}, {"term": null, "text": "Ways to serve others."}]}, "Share private struggles only with people who have shown they are safe and trustworthy. If you are facing abuse, addiction, or a crisis, please seek qualified pastoral, professional, or emergency help."], "refs": "Hebrews 10:24–25 · Acts 2:42 · Galatians 6:1–2", "group": null}, {"title": "Note on sources", "paras": ["These pages draw on Christian writers on spiritual formation, including James Bryan Smith, Dallas Willard, Justin Whitmel Earley, and Richard Foster. Yada isn’t affiliated with them, they don’t agree on every question, and Scripture remains the authority."], "refs": null, "group": null}], "types": {"1": {"stories": [{"story": "If I’m not doing things right, I’m not acceptable.", "truth": "We are made right with God by grace through faith in Christ, not by a flawless record.", "refs": "Ephesians 2:8–9 · Philippians 3:8–9"}, {"story": "If I disappoint someone, I have failed.", "truth": "We are accountable to God first. We can own real wrongs and make them right without treating every disappointment as failure.", "refs": "Galatians 1:10 · 1 Corinthians 4:3–5"}], "love": {"text": "Order and excellence are good, but they can become more important to us than mercy and people.", "refs": "Matthew 23:23"}}, "2": {"stories": [{"story": "I’m loved for what I give.", "truth": "God’s love comes first. It is not earned by being helpful.", "refs": "1 John 4:9–10, 19"}, {"story": "If I have needs, I’m a burden.", "truth": "Scripture invites us to bring our needs to God and to carry one another’s burdens.", "refs": "1 Peter 5:7 · Galatians 6:2"}], "love": {"text": "Helping others is good, but service can become a way to win approval or keep control.", "refs": "Matthew 6:1–4"}}, "3": {"stories": [{"story": "I must accomplish enough to be valuable.", "truth": "Our standing before God is a gift of grace. Good works are the fruit of His grace, not the price of His love.", "refs": "Ephesians 2:8–10"}, {"story": "If I fail, I am a failure.", "truth": "God’s people fail and are restored. Jesus restored Peter after his denial and called him to keep following.", "refs": "John 21:15–19"}], "love": {"text": "Work is good, but achievement can push out rest, relationships, and other responsibilities.", "refs": "Psalm 127:1–2 · Mark 8:36"}}, "4": {"stories": [{"story": "Something is missing in me that others have.", "truth": "Every person is made in God’s image. What our hearts long for most is found in God Himself.", "refs": "Genesis 1:27 · Psalm 73:25–26"}, {"story": "If no one understands me, I am alone.", "truth": "God knows us completely, and He places His people in community where we can be known.", "refs": "Psalm 139:1–6 · Hebrews 10:24–25"}], "love": {"text": "Emotional depth and beauty are good, but feelings can become the final authority for how we live.", "refs": "Proverbs 3:5–6"}}, "5": {"stories": [{"story": "If I don’t have enough energy or knowledge, I can’t engage.", "truth": "God’s grace enables generosity, and Christ meets us in weakness. We can serve faithfully while recognizing our limits.", "refs": "2 Corinthians 9:8 · 2 Corinthians 12:9–10"}, {"story": "Understanding something is the same as living it.", "truth": "Jesus calls those who hear His words to put them into practice.", "refs": "Matthew 7:24–27 · James 1:22"}], "love": {"text": "Knowledge is good, but learning can become a substitute for obedience or a way to keep distance from people.", "refs": "1 Corinthians 8:1"}}, "6": {"stories": [{"story": "If I can’t control something, I can’t be safe.", "truth": "God doesn’t promise a life without danger, but He is present with His people, and we can bring every fear to Him in prayer.", "refs": "Philippians 4:6–7 · Psalm 56:3–4"}, {"story": "Trusting people is foolish.", "truth": "Our deepest trust belongs to God. Wisdom weighs what is  doesn’t depend on everyone agreeing with us.", "refs": "Romans 15:7 · Ephesians 4:15"}, {"story": "My voice doesn’t matter much.", "truth": "Every member of Christ’s body has something to contribute, and speaking the truth in love helps the whole body grow.", "refs": "1 Corinthians 12:21–26 · Ephesians 4:15–16"}], "love": {"text": "Peace is good, but keeping things comfortable can become an excuse for withholding needed truth.", "refs": "Proverbs 27:5–6 · Matthew 5:9"}}}, "invitation": {"title": "The invitation to become", "paras": ["Following Jesus is not simply about changing our behavior. It is about becoming more like Him.", "As Christians, we are invited into a lifelong process of transformation. It is often slow. Sometimes painfully slow.", "We may recognize struggles long before we experience freedom from them. We may discover that our habits, desires, and responses have been shaped by years of living in ways we barely noticed.", "But Jesus does not simply call us to try harder. He calls us to follow Him.", "Jesus is our Savior, our Teacher, and our Lord. We depend on His grace for salvation. We learn from His teaching. And we seek to bring every part of our lives under His authority.", "As we abide in Christ, walk by the Holy Spirit, and practice His teachings, God works within us to reshape our hearts.", "We learn to recognize sin and turn away from it. We learn to see when good things have taken an unhealthy place in our lives. We learn to recognize opportunities for love and obedience that we once overlooked. And we learn to receive God’s gifts, including rest, relationships, beauty, and joy, with gratitude.", "Sometimes transformation means learning to say no. Sometimes it means learning to say yes. Sometimes it means having the courage to act. And sometimes it means having the faith to rest.", "The goal isn’t simply to become better at managing ourselves. It’s to become people who increasingly love what Jesus loves and respond as He would.", "We cannot accomplish that through willpower alone. But neither are we called to remain passive. Through God’s grace, we participate in the slow, lifelong work of becoming more like Christ.", "Yada exists to encourage that journey. Personality insights may help us recognize tendencies, but they do not define our identity, determine our character, or excuse our sin. Scripture remains our authority. Christ remains our Savior, Teacher, and Lord. And the Holy Spirit remains the source of genuine transformation.", "We are not simply trying to change what we do. We are learning, by God’s grace, to become more like Jesus."], "refs": "2 Corinthians 3:18 · Romans 12:2 · Galatians 5:16–25 · Philippians 2:12–13 · John 15:4–5", "short": 4}}};

    <details class="more"><summary class="small">What each name emphasizes</summary><ul class="small" style="margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px">${N.options.map((o) => `<li><strong>${h(o.name)}:</strong> ${h(o.about)}</li>`).join("")}</ul></details>

// Tester results: everything needed to rerun the finder, in one line of text.
const ALLKEYS = [
  ...TYPES.flatMap((t) => BANK[t].map((_, k) => `${t}.${k}`)),
  ...Object.keys(TIE).flatMap((p) => TIE[p].map((_, i) => `x:${p}:${i}`)),

function resultsCode(s) {

  const duels = Object.entries(s.duel).filter(([, v]) => v.length).map(([k, v]) => k.replace("-", "") + v.map((x) => DUELCODE[x]).join("")).join(",");
