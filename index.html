<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Discover what drives you: a short, Christ-centered Enneagram type finder from Yada.">
</head>
<body>
<title>Yada Type Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ovo&family=Karla:wght@400;500;700&family=Frank+Ruhl+Libre:wght@900&display=swap">
<style>
/* Layout: one narrow reading column, one decision per screen, like a page in a journal. */
:root {
  --bg: #f7f2ea; --surface: #fffdf9; --ink: #2d2620; --ink-soft: #5f554b; --line: #e3d9cb;
  --brand: #6b4f2e; --brand-ink: #f3e9d8; --pick: #55704f; --focus: #2f5c7c;
  --display: "Ovo", Georgia, "Times New Roman", serif;
  --body: "Karla", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #1d1915; --surface: #27221d; --ink: #efe6d9; --ink-soft: #b5a998; --line: #3d352d;
  --brand: #c9a77a; --brand-ink: #1d1915; --pick: #9cbf93; --focus: #8fb8d6; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #1d1915; --surface: #27221d; --ink: #efe6d9; --ink-soft: #b5a998; --line: #3d352d;
  --brand: #c9a77a; --brand-ink: #1d1915; --pick: #9cbf93; --focus: #8fb8d6; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 17px; line-height: 1.55; }
main { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 64px; display: flex; flex-direction: column; gap: 22px; }
header { display: flex; align-items: center; gap: 12px; }
.mark { width: 40px; height: 40px; border-radius: 10px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: "Frank Ruhl Libre", "Times New Roman", serif; font-size: 26px; font-weight: 900; line-height: 1; }
.brand { font-family: var(--display); font-size: 22px; }
.brand small { display: block; font-family: var(--body); font-size: 13px; color: var(--ink-soft); }
h1, h2, h3 { font-family: var(--display); font-weight: 400; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: 34px; } h2 { font-size: 26px; } h3 { font-size: 22px; }
p { margin: 0; }
.muted { color: var(--ink-soft); }
.small { font-size: 14px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); font-weight: 700; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
button { font: inherit; font-weight: 700; border-radius: 999px; border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); padding: 10px 20px; cursor: pointer; }
button.secondary { background: transparent; color: var(--brand); }
button:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
label { font-weight: 500; }
input[type=text], select, textarea { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; box-sizing: border-box; }
textarea { min-height: 70px; font-size: 14px; }
.cards { display: grid; gap: 10px; }
.card { text-align: left; font-weight: 400; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 12px; align-items: start; }
.card .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line); margin-top: 2px; display: grid; place-items: center; font-size: 14px; color: var(--bg); }
.card[aria-pressed="true"] { border-color: var(--pick); box-shadow: inset 0 0 0 1px var(--pick); }
.card[aria-pressed="true"] .box { background: var(--pick); border-color: var(--pick); }
.mode { text-align: left; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 16px; font-weight: 400; display: flex; flex-direction: column; gap: 4px; }
.mode strong { font-family: var(--display); font-weight: 400; font-size: 20px; }
.mode[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress div { height: 100%; background: var(--brand); transition: width .25s; }
.versus { display: grid; gap: 10px; }
.side { text-align: left; font-weight: 400; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; padding: 18px; font-family: var(--display); font-size: 21px; line-height: 1.35; }
.side[aria-pressed="true"] { border-color: var(--pick); box-shadow: inset 0 0 0 2px var(--pick); }
.or { text-align: center; font-size: 13px; color: var(--ink-soft); }
.alt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.alt button { font-weight: 500; }
.alt button[aria-pressed="true"] { background: var(--ink-soft); border-color: var(--ink-soft); color: var(--bg); }
.rate { display: grid; grid-template-columns: 1fr; gap: 8px; }
.rate button { font-weight: 700; font-size: 16px; padding: 13px 16px; text-align: left; background: transparent; color: var(--ink-soft); border-color: var(--line); }
.rate button[aria-pressed="true"] { background: var(--pick); border-color: var(--pick); color: var(--bg); }
.statement { font-family: var(--display); font-size: 26px; line-height: 1.35; text-wrap: balance; min-height: 3.2em; }
.stages { display: flex; gap: 6px; }
.stages span { flex: 1; height: 6px; border-radius: 99px; background: var(--line); }
.stages span.on { background: var(--brand); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; color: var(--ink-soft); }
.chip.on { border-color: var(--pick); color: var(--ink); }
.tag { align-self: flex-start; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; color: var(--ink-soft); }
.note { border-left: 3px solid var(--brand); padding: 4px 0 4px 14px; }
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar { display: grid; grid-template-columns: 26px minmax(0, 1fr) 72px; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.bar .track { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--ink-soft); border-radius: 99px; }
.bar.top .fill { background: var(--brand); }
.bar b { font-family: var(--display); font-size: 18px; font-weight: 400; }
/* The tester box is a light card in both themes so it stands out from everything else. */
.printonly { display: none; }
.lifeblock { display: flex; flex-direction: column; gap: 8px; }
.liferow-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.liferow-nav { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.arrow { padding: 4px 12px; line-height: 1.2; }
.liferow { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding-left: 0; padding-bottom: 6px; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.lifecard { box-sizing: border-box; flex: 0 0 86%; max-width: 480px; scroll-snap-align: start; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.lifecard h3 { font-size: 20px; }
.contrast { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .contrast { grid-template-columns: 1fr; } }
.cbox { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--bg); }
.cbox.word { border-color: var(--brand); }
.namegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.namegrid .mode { padding: 12px; min-width: 0; }
.namegrid .mode .small { font-size: 12.5px; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; }
.chipbtn { font-weight: 500; font-size: 14px; padding: 6px 12px; background: transparent; color: var(--ink-soft); border-color: var(--line); }
.chipbtn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.relbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.relbtns button { padding: 10px 12px; }
.typegrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.typegrid .mode { padding: 10px 4px; align-items: center; text-align: center; gap: 0; min-width: 0; }
.typegrid .mode .small { font-size: 12px; overflow-wrap: anywhere; }
.typegrid .mode strong { font-size: 22px; }
.fric { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; background: var(--bg); }
.fric summary { cursor: pointer; font-weight: 700; }
.fric[open] { border-color: var(--brand); }
.fbbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; padding: 10px 16px calc(12px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
.fbbar[hidden] { display: none; }
.fbbar button { pointer-events: auto; box-shadow: 0 6px 24px rgba(0, 0, 0, .3); padding: 12px 20px; max-width: 100%; font-size: 15px; white-space: nowrap; }
.nudge { border: 1px solid color-mix(in srgb, var(--brand) 50%, transparent); background: color-mix(in srgb, var(--brand) 12%, var(--surface)); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.nudge[hidden] { display: none; }
.invitebox { gap: 8px; margin-top: 6px; padding: 16px; border-radius: 12px; background: color-mix(in srgb, var(--brand) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brand) 50%, transparent); }
.invitebox h3 { color: var(--ink); }
button.linkish { background: none; border: 0; padding: 0; border-radius: 0; color: var(--brand); font-weight: 500; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.callout { --surface: #fff; --ink: #2d2620; --ink-soft: #5f554b; --line: #e3d9cb; --brand: #6b4f2e; --brand-ink: #fffaf0; --focus: #2f5c7c;
  color-scheme: light; color: var(--ink); background: #fffaf0; border: 2px solid #d9bf94; box-shadow: 0 8px 28px rgba(201, 167, 122, .35); padding: 24px 20px; }
.callout h2 { font-size: 30px; }
.callout .fblabel { font-family: var(--display); font-size: 22px; font-weight: 400; margin-top: 6px; }
.callout textarea { min-height: 130px; font-size: 16px; border: 2px solid #d9bf94; }
.callout .eyebrow { color: var(--brand); }
code.share { user-select: all; -webkit-user-select: all; display: block; font-size: 13px; word-break: break-all; background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; }
.read { max-width: 62ch; display: flex; flex-direction: column; gap: 18px; font-size: 18px; line-height: 1.7; }
.read h2 { font-size: 27px; margin-top: 14px; }
.read .lede { font-size: 20px; }
.read .quote { font-family: var(--display); font-size: 25px; line-height: 1.4; border-left: 3px solid var(--brand); padding: 2px 0 2px 18px; margin: 4px 0; text-wrap: balance; }
.read .quote cite { display: block; font-family: var(--body); font-style: normal; font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
.read .isnt { display: flex; flex-direction: column; gap: 14px; }
.read .isnt strong { font-family: var(--display); font-weight: 400; font-size: 20px; }
.read .orn { text-align: center; color: var(--ink-soft); font-family: "Frank Ruhl Libre", serif; font-weight: 900; font-size: 30px; line-height: 1; color: var(--brand); margin: 8px 0; }
.read .close { font-family: var(--display); font-size: 21px; line-height: 1.5; text-align: center; text-wrap: balance; }
.readbar { position: fixed; left: 0; right: 0; top: 0; height: calc(4px + env(safe-area-inset-top, 0px)); padding-top: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; box-sizing: border-box; }
.readbar div { height: 4px; width: 0; background: var(--brand); }
@media (prefers-reduced-motion: reduce) { .progress div { transition: none; } }
/* Save as PDF or print: light colors, no controls, tighter sizes. Small boxes stay whole;
   tall ones (.tall) may continue on the next page with their border repeated. */
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --bg: #fff; --surface: #fff; --ink: #2d2620; --ink-soft: #5f554b; --line: #e3d9cb;
    --brand: #6b4f2e; --brand-ink: #f3e9d8; --pick: #55704f; color-scheme: light; }
  @page { size: letter; margin: 14mm 15mm; }
  body { font-size: 10.5pt; line-height: 1.45; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  main { max-width: none; padding: 0; gap: 10px; }
  header .mark { width: 30px; height: 30px; font-size: 19px; border-radius: 8px; }
  .brand { font-size: 17px; }
  h1 { font-size: 24pt; } h3 { font-size: 14pt; }
  .stack { gap: 8px; }
  .panel { padding: 12px 16px; gap: 7px; border-radius: 10px; break-inside: avoid; }
  .panel.tall { break-inside: auto; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  p, li, .bar, h3 + p { break-inside: avoid; }
  h1, h2, h3, .eyebrow, .tag { break-after: avoid; }
  .bars { gap: 4px; }
  .small { font-size: 9pt; }
  .noprint, button, select, label[for="translation"] { display: none !important; }
  .printonly { display: block !important; }
  a { color: inherit; }
}
</style>

<main id="app" aria-live="polite"></main>

<script>
// Ten everyday statements per type, alternating a good day and a hard day.
// The first two of each type are asked of everyone; the rest only if that
// type is still in the running.
const BANK = {
  1: ["I notice how things could be done better, and I like improving them.", "I'm hard on myself when I make a mistake.",
      "I keep my word, even when it costs me.", "I get irritated when people are careless or cut corners.",
      "Doing things the right way matters more to me than doing them fast.", "There's a critical voice in my head that's rarely satisfied.",
      "People trust my sense of what's fair.", "I find it hard to relax until the work is done.",
      "I follow through on what I start.", "I hold my frustration in, and it leaks out later."],
  2: ["I notice what people need before they ask.", "I have a hard time saying what I need.",
      "I love being the one who shows up for people.", "I feel hurt when my help isn't noticed.",
      "People tell me I make them feel cared for.", "I say yes to people even when I'm running on empty.",
      "I remember the little details of people's lives.", "Putting myself first makes me feel guilty.",
      "I make people feel welcome.", "I sometimes help so that people will like me."],
  3: ["I like setting goals and hitting them.", "I struggle to slow down and just be.",
      "I can rally people around a goal.", "I care a lot about how I come across.",
      "I adapt quickly to whatever a situation needs.", "When I fail, it feels like it says something about my worth.",
      "I get a lot done in a day.", "I stay busy so I don't have to deal with feelings.",
      "I know how to present an idea so people buy in.", "I judge my day by how much I accomplished."],
  4: ["I feel things deeply and notice beauty others miss.", "I often feel like something is missing in me.",
      "I'd rather have a real conversation than small talk.", "I feel misunderstood, even by people close to me.",
      "People come to me when something hurts.", "I compare my life to others' and feel I come up short.",
      "I express myself in creative ways.", "My moods color my whole day.",
      "I'm drawn to what's meaningful and authentic.", "I long for what I don't have."],
  5: ["I love understanding how things really work.", "I need a lot of time alone to recharge.",
      "I stay calm and think clearly when others panic.", "I get drained when people need too much from me.",
      "I'd rather understand one thing deeply than a little about a lot.", "I'd rather watch and think than jump in.",
      "I research before I make a decision.", "I keep my feelings to myself.",
      "People value my honest, objective take.", "I hold on to my time and energy in case I need it later."],
  6: ["People know they can count on me.", "I have a hard time trusting people.",
      "I'm good at spotting problems before they happen.", "I often imagine what could go wrong.",
      "I stay loyal to people even when it's hard.", "I second-guess my decisions.",
      "I like being prepared for what's ahead.", "I look for reassurance before I decide.",
      "I'll ask the hard questions others avoid.", "I wonder about people's real motives."],
  7: ["I'm usually the one with the big idea.", "I lose interest once the excitement wears off.",
      "I see possibilities where others see dead ends.", "I'd rather plan the next thing than sit with something painful.",
      "I get people excited about what could be.", "I hate feeling boxed in or tied down.",
      "I'm quick to start new projects.", "I have more ideas than I finish.",
      "I can find the bright side of almost anything.", "I keep my calendar full so I don't miss out."],
  8: ["I take charge when no one else will.", "I have a hard time letting people see me vulnerable.",
      "I fiercely protect the people I love.", "People sometimes find me intimidating.",
      "I say what everyone else is thinking.", "I push back hard when someone tries to control me.",
      "I make decisions quickly.", "I can come on too strong.",
      "I stand up for people who can't stand up for themselves.", "People have to earn my trust."],
  9: ["I can usually see every side of a disagreement.", "I go along with others to avoid conflict.",
      "People tell me they feel calm around me.", "I sometimes lose track of what I actually want.",
      "I help people understand each other.", "I put off things that feel uncomfortable.",
      "I'm easygoing and adapt to others' plans.", "I zone out in routines or screens when life feels heavy.",
      "I accept people as they are.", "It's hard for me to know my own opinion."],
};
// Positive lines for the final round: "What lights you up more?"
const CORE = {
  // Every line names the type's gift at its best, so no option sounds more noble than another.
  1: ["Making something better than it was.", "Seeing something done with excellence and integrity.", "Standing for what's right."],
  2: ["Making a real difference in someone's life.", "Being there for someone when they need it most.", "Bringing care and warmth to the people around me."],
  3: ["Seeing a team succeed because of what we built.", "Reaching a goal that seemed out of reach.", "Inspiring people to bring their best."],
  4: ["Creating something honest and beautiful.", "A conversation where someone feels truly understood.", "Helping people find meaning in what they're going through."],
  5: ["Finally understanding something complex.", "Solving a problem no one else could figure out.", "Giving someone a clear, wise answer."],
  6: ["Being part of a team that has each other's backs.", "Helping my people be ready for what's ahead.", "Staying faithful when others give up."],
  7: ["Seeing a better future and getting people excited about it.", "Finding a way forward when everyone else is stuck.", "Bringing hope and joy into a room."],
  8: ["Taking on a big challenge and making it happen.", "Standing up for someone who can't stand up for themselves.", "Leading people through something hard."],
  9: ["Helping people who disagree find common ground.", "Bringing calm to a tense situation.", "Making everyone feel included and at ease."],
};
// Struggle lines for the final round, written to be equally hard to admit.
// Round 1 asks about a gift; rounds 2 and 3 ask about struggles.
const STRUGGLE = {"1": ["I get critical of myself and others when things aren't done right.", "I hold in my frustration until it comes out sideways."], "2": ["I give and give, then quietly resent it when no one notices.", "I struggle to say what I actually need."], "3": ["I measure my worth by what I get done.", "I shape myself into whatever will impress the people around me."], "4": ["I dwell on what's missing in my life.", "I feel misunderstood, even by the people closest to me."], "5": ["I pull away when people need too much from me.", "I hold back from jumping in until I've figured it all out."], "6": ["My mind runs ahead to everything that could go wrong.", "I second-guess myself and look for reassurance."], "7": ["I move on to something new when things get hard or boring.", "I avoid sitting with painful feelings."], "8": ["I come on too strong and can steamroll people.", "I struggle to let people see me vulnerable."], "9": ["I go along with others to avoid conflict.", "I lose track of what I actually want."]};
const duelLine = (t, k) => k === 0 ? CORE[t][0] : STRUGGLE[t][k - 1];

// Tiebreakers for commonly confused pairs, asked only when both reach the final round.
const TIE = {
  "1-7": [[1, "When plans fall apart, my first thought is what should have been done differently."], [7, "When plans fall apart, my first thought is what else we could try."],
          [1, "I'd rather do one thing right than many things fast."], [7, "I'd rather try many things than perfect one."]],
  "3-7": [[3, "I'd rather finish strong than start something new."], [7, "Starting something new energizes me more than finishing."],
          [3, "I stay with a project until it's a clear success."], [7, "Once I've figured something out, I'm ready to move on."]],
  "7-8": [[7, "I'd rather keep things light than have a confrontation."], [8, "I don't mind a confrontation if it gets things done."],
          [7, "I win people over with enthusiasm."], [8, "I win people over with conviction and strength."]],
  "6-7": [[6, "Before I commit, I think through what could go wrong."], [7, "I commit first and figure out the details later."],
          [6, "I feel best with a plan and people I trust."], [7, "I feel best when I have lots of options."]],
  "2-7": [[2, "I feel best when someone needs me."], [7, "I feel best when I'm free to follow my own ideas."],
          [2, "I tend to fit my plans around other people's."], [7, "I tend to invite people into my plans."]],
  "5-7": [[5, "I'd rather go deep into one subject."], [7, "I'd rather explore lots of interests."],
          [5, "Too much going on drains me."], [7, "Lots going on energizes me."]],
  "2-9": [[2, "I move toward people to help them."], [9, "I go along with people so things stay peaceful."],
          [2, "It stings when no one thanks me."], [9, "I don't need thanks; I just want things calm."]],
  "1-6": [[1, "I trust my own sense of right and wrong."], [6, "I look to people or guidelines I trust before deciding."],
          [1, "I'm usually confident about the right way to do something."], [6, "I often doubt whether I'm doing it right."]],
  "3-8": [[3, "I adjust my style to win people over."], [8, "I am who I am, whether people like it or not."],
          [3, "I want people to admire what I've done."], [8, "I want people to respect my strength."]],
  "4-5": [[4, "I work through life by feeling it."], [5, "I work through life by thinking it through."],
          [4, "I want to express what I feel."], [5, "I'd rather understand a feeling than express it."]],
  "6-9": [[6, "In a crisis, my mind runs through what could happen."], [9, "In a crisis, I stay calm, maybe too calm."],
          [6, "I stay alert to problems."], [9, "I tune out problems I can't fix."]],
  "1-3": [[1, "Doing it right matters more than how it looks."], [3, "How it comes across matters a lot."],

{"title": "Withdrawing when hurt", "what": "Emotional withdrawal can leave children feeling disconnected.", "underneath": null, "response": "Take appropriate time to regain composure, then return with warmth and honest communication.", "extra": [], "prayer": "Help me remain faithful and present.", "refs": "Colossians 3:12–13"}], "leaderGood": ["You can bring meaning and creativity to work.", "You can recognize the human experience behind performance.", "You can encourage authenticity and thoughtful expression."], "leaderHard": [{"title": "Mood-driven leadership", "what": "Your emotional state may create uncertainty for others.", "underneath": null, "response": "Practice steadiness, self-control, and fair treatment regardless of your mood.", "extra": [], "prayer": "Help me lead with wisdom and self-control.", "refs": "Galatians 5:22–23"}, {"title": "Taking feedback personally", "what": "Criticism of your work may feel like rejection of your identity.", "underneath": null, "response": "Receive correction humbly and separate personal worth from performance.", "extra": [], "prayer": "Give me a teachable heart.", "refs": "Proverbs 12:1"}], "lives": [{"who": "Jeremiah", "sub": "Faithfulness through sorrow", "text": "Jeremiah faithfully proclaimed God’s message while experiencing rejection and deep anguish. His lamentations reveal the reality of suffering in faithful service.", "lesson": "Honest lament and obedience can coexist. Pain does not mean God has abandoned His servant.", "refs": "Jeremiah 1 · 20:7–18 · 31:31–34", "woman": false}, {"who": "David", "sub": "Worship, sin, and repentance", "text": "David expressed profound joy and sorrow in the Psalms. He also committed grave sins against Bathsheba and Uriah and was confronted by Nathan.", "lesson": "Emotional depth does not excuse sin. God calls us to honest confession and repentance.", "refs": "2 Samuel 11–12 · Psalm 51", "woman": false}, {"who": "Hannah", "sub": "Sorrow brought before God", "text": "Hannah suffered deeply because of infertility and mistreatment. She brought her grief to God in prayer.", "lesson": "Suffering is not a personality defect. God welcomes honest prayer from those who are hurting.", "refs": "1 Samuel 1:6–20", "woman": true}, {"who": "Naomi", "sub": "Grief and providence", "text": "Naomi endured the deaths of her husband and sons and openly expressed bitterness over her suffering. God’s providence unfolded through Ruth and Boaz.", "lesson": "God’s faithfulness is not limited by what we can understand in seasons of loss.", "refs": "Ruth 1 · 4:13–17", "woman": true}]}, "5": {"n": 5, "name": "Investigator", "longs": "Understanding, competence, privacy, and time to think.", "fear": "Being overwhelmed, unprepared, or incapable.", "care": "Offering thoughtful insight, practical assistance, and careful attention.", "brings": "Stability, thoughtful decisions, loyalty, and calm reflection.", "blind": "Using distance, analysis, or independence to avoid relational responsibility.", "conflict": "Withdraw to process information or respond with analysis before acknowledging emotions.", "helps": "Clear communication and reasonable processing time, followed by a commitment to reengage.", "stress": "Excessive demands, uncertainty, interruptions, and emotional pressure.", "supported": "Respectful boundaries, clear expectations, and thoughtful dialogue.", "decides": "Research, careful analysis, and available evidence.", "feedback": "Specific correction with an opportunity to reflect and respond.", "leads": "Expertise, preparation, and independent judgment.", "values": "Competence, thoughtfulness, preparation, and autonomy.", "fromLeader": "Clear information, appropriate independence, and reasonable expectations.", "world": "If you know enough and remain independent, you won’t need anyone. Knowledge and self-sufficiency will keep you secure.", "scripture": {"text": "Knowledge is valuable, but it must be governed by humility and love. Believers are called to use their gifts in service to others.", "refs": "1 Corinthians 8:1 · 1 Peter 4:10"}, "grow": "Let understanding lead to obedience and love. Practice generosity with your time, attention, and knowledge.", "heart": "Am I using knowledge to serve others, or to avoid depending on and loving them?", "marriage": [{"title": "Withdrawing to recharge", "what": "Solitude may be helpful, but unexplained withdrawal can leave your spouse feeling abandoned.", "underneath": "Concern about emotional or mental overload.", "response": "Communicate your need for time, agree to return, and follow through.", "extra": [], "prayer": "Lord, help me love faithfully through my presence.", "refs": "Philippians 2:4"}, {"title": "Analyzing instead of listening", "what": "You may try to solve an emotional concern before understanding it.", "underneath": "A preference for clarity and manageable problems.", "response": "Listen first, show compassion, and offer solutions when appropriate.", "extra": [], "prayer": "Make me quick to listen and slow to speak.", "refs": "James 1:19 · Romans 12:15"}], "parentGood": ["You can nurture curiosity and learning.", "You can model careful thinking.", "You can encourage children to develop sound judgment."], "parentHard": [{"title": "Being mentally absent", "what": "Children may experience you as unavailable even when you are physically nearby.", "underneath": null, "response": "Offer intentional attention and engage with their interests.", "extra": [], "prayer": "Help me be attentive to those entrusted to my care.", "refs": "Philippians 2:4"}, {"title": "Withholding affection", "what": "Children may struggle to recognize love that is rarely expressed.", "underneath": null, "response": "Demonstrate affection through appropriate words, attention, and action.", "extra": [], "prayer": "Teach me to love in deed and truth.", "refs": "1 John 3:18"}], "leaderGood": ["You can make informed decisions.", "You can remain composed under pressure.", "You can encourage independent thinking."], "leaderHard": [{"title": "Remaining distant", "what": "Your team may lack direction or encouragement because you prefer independent work.", "underneath": null, "response": "Make yourself appropriately available and communicate expectations clearly.", "extra": [], "prayer": "Help me use my gifts to serve others.", "refs": "1 Peter 4:10"}, {"title": "Withholding information", "what": "Waiting for perfect understanding may leave others unable to act.", "underneath": null, "response": "Share relevant information honestly, including what remains uncertain.", "extra": [], "prayer": "Give me wisdom to communicate truthfully.", "refs": "Ephesians 4:25"}], "lives": [{"who": "Thomas", "sub": "Questions and faith", "text": "Thomas expressed willingness to follow Jesus into danger. After the resurrection, he initially refused to believe the other disciples’ testimony without seeing Jesus himself.", "lesson": "Honest questions can be brought to Christ, but faith must ultimately respond to His truth.", "refs": "John 11:16 · 20:24–29", "woman": false}, {"who": "Nicodemus", "sub": "Seeking understanding", "text": "Nicodemus came to Jesus with questions, later spoke in favor of fair treatment, and participated in Jesus’ burial.", "lesson": "Understanding God’s truth should lead toward courageous action.", "refs": "John 3:1–21 · 7:50–51 · 19:39–40", "woman": false}, {"who": "Daniel", "sub": "Wisdom and faithfulness", "text": "Daniel demonstrated wisdom, prayerfulness, and integrity in exile. Some divine revelations left him physically overwhelmed.", "lesson": "Wisdom comes from God, and faithfulness matters even when circumstances exceed our understanding.", "refs": "Daniel 1:17–20 · 6 · 8:27", "woman": false}, {"who": "Nathanael", "sub": "Honest skepticism", "text": "Nathanael questioned whether anything good could come from Nazareth. After meeting Jesus, he confessed Him as the Son of God.", "lesson": "Initial assumptions should be surrendered when confronted with truth.", "refs": "John 1:43–51", "woman": false}, {"who": "Mary of Bethany", "sub": "Listening and devotion", "text": "Mary sat at Jesus’ feet listening to His teaching, and Jesus said she had chosen the good portion. When Lazarus died, she remained in the house while Martha went out to meet Jesus. Later she anointed Jesus with costly ointment, and Jesus connected her act with the day of His burial.", "lesson": "Understanding Christ should lead not to distance but to wholehearted devotion.", "refs": "Luke 10:38–42 · John 11:20, 28–33 · John 12:1–8", "woman": true}, {"who": "Priscilla", "sub": "Knowledge used to build up", "text": "Priscilla and her husband, Aquila, heard Apollos, an eloquent teacher who knew only the baptism of John. They took him aside and explained the way of God to him more accurately. Paul later called them his fellow workers in Christ Jesus.", "lesson": "Knowledge is meant to serve others in love, not to set us above them.", "refs": "Acts 18:24–28 · Romans 16:3–4", "woman": true}, {"who": "The Queen of Sheba", "sub": "Seeking wisdom firsthand", "text": "Hearing of Solomon’s fame, the Queen of Sheba came to test him with hard questions. She said she had not believed the reports until she came and saw for herself, and she blessed the LORD. Jesus later pointed to her as one who traveled far to hear wisdom.", "lesson": "Honest inquiry is good, and its proper end is not merely knowledge but recognizing and honoring God.", "refs": "1 Kings 10:1–10 · Matthew 12:42", "woman": true}]}, "6": {"n": 6, "name": "Loyalist", "longs": "Security, reliability, belonging, and trustworthy relationships.", "fear": "Betrayal, abandonment, uncertainty, or being unprepared.", "care": "Preparing carefully, remaining loyal, and following through.", "brings": "Commitment, responsibility, attentiveness, and dependability.", "blind": "Allowing fear to produce suspicion, excessive reassurance-seeking, or hesitation.", "conflict": "Ask repeated questions, anticipate negative outcomes, or struggle with uncertainty.", "helps": "Honest communication, consistent behavior, and respectful attention to legitimate concerns.", "stress": "Broken promises, uncertainty, contradictory information, and unexpected changes.", "supported": "Truthfulness, reliability, clarity, and appropriate reassurance.", "decides": "Assessing risks, gathering information, and seeking wise counsel.", "feedback": "Clear, consistent correction that distinguishes facts from assumptions.", "leads": "Preparation, loyalty, responsibility, and risk awareness.", "values": "Honesty, dependability, cooperation, and commitment.", "fromLeader": "Consistency, clear expectations, and trustworthy conduct.", "world": "You must eliminate uncertainty to be safe. If you anticipate every danger, you can prevent every disappointment.", "scripture": {"text": "God calls His people to trust Him while acting with wisdom. Faith does not remove all uncertainty, and prudence is not the same as fear-driven control.", "refs": "Matthew 6:25–34 · Proverbs 3:5–6"}, "grow": "Practice courage, discernment, and faithfulness. Distinguish evidence from imagination, and refuse to let fear govern every decision.", "heart": "Am I responding to what is true, or allowing fear to decide for me?", "marriage": [{"title": "Worry and worst-case thinking", "what": "Repeatedly anticipating danger may burden your spouse or overshadow genuine blessings.", "underneath": "Desire to protect yourself and your family.", "response": "Prepare wisely, communicate concerns honestly, and entrust what you cannot control to God.", "extra": [], "prayer": "Lord, give me wisdom for today and trust for tomorrow.", "refs": "Matthew 6:34"}, {"title": "Suspicion and broken trust", "what": "Fear may lead to repeated questioning or assumptions about motives.", "underneath": "Fear of betrayal or abandonment.", "response": "Distinguish actual wrongdoing from imagined threats. Avoid false accusations and seek truth with humility.", "extra": ["When trust has genuinely been broken, rebuilding it requires honesty, repentance, and consistent changed behavior from the person responsible. Forgiveness does not require immediate trust."], "prayer": "Lord, guide me in truth, wisdom, and courage.", "refs": "Ephesians 4:25 · James 1:5"}], "parentGood": ["You can model loyalty and dependability.", "You can teach children preparation and responsibility.", "You can advocate for their safety and well-being."], "parentHard": [{"title": "Passing along fear", "what": "Children may absorb excessive anxiety about ordinary uncertainties.", "underneath": null, "response": "Teach wise caution alongside courage and trust in God.", "extra": [], "prayer": "Help me teach wisdom without cultivating fear.", "refs": "Proverbs 3:5–6"}, {"title": "Overprotecting", "what": "Attempting to prevent every difficulty can limit opportunities for growth.", "underneath": null, "response": "Provide age-appropriate guidance while allowing children to develop responsibility.", "extra": [], "prayer": "Give me wisdom to prepare and release them appropriately.", "refs": "Ephesians 6:4"}], "leaderGood": ["You can recognize risks early.", "You can build dependable systems.", "You can demonstrate loyalty and responsibility."], "leaderHard": [{"title": "Delaying decisions", "what": "Seeking complete certainty may prevent necessary action.", "underneath": null, "response": "Gather appropriate counsel, make responsible decisions, and accept that perfect certainty is rarely possible.", "extra": [], "prayer": "Lord, give me wisdom to act faithfully.", "refs": "James 1:5 · Proverbs 15:22"}, {"title": "Assuming the worst", "what": "Excessive suspicion can discourage creativity and damage trust.", "underneath": null, "response": "Evaluate ideas fairly, distinguish real risks from imagined ones, and judge others honestly.", "extra": [], "prayer": "Teach me discernment without fear-driven suspicion.", "refs": "Proverbs 18:13"}], "lives": [{"who": "Gideon", "sub": "Fear and on, repetitive demands, disappointment, and prolonged uncertainty.", "supported": "Shared enjoyment, meaningful freedom, and honest partnership through difficulty.", "decides": "Possibilities, opportunities, enthusiasm, and quick judgment.", "feedback": "Truthful, direct correction that does not allow optimism to replace accountability.", "leads": "Generating ideas, encouraging people, and recognizing opportunities.", "values": "Creativity, initiative, enthusiasm, and adaptability.", "fromLeader": "Clear priorities, appropriate freedom, and opportunities to contribute ideas.", "world": "Your happiness comes first. Avoid what hurts, pursue what excites you, and don’t let commitments limit your freedom.", "scripture": {"text": "Jesus calls His followers to deny themselves, remain faithful, and find joy in Him rather than in favorable circumstances.", "refs": "Luke 9:23 · John 15:9–11 · James 1:2–4"}, "grow": "Practice perseverance, contentment, self-control, and faithfulness. Learn to remain present when love requires sacrifice.", "heart": "Am I pursuing joy in Christ, or using pleasure and distraction to avoid obedience?", "marriage": [{"title": "Avoiding difficult conversations", "what": "You may use humor, optimism, or distraction to escape uncomfortable discussions.", "underneath": "Fear of emotional pain or prolonged conflict.", "response": "Listen patiently, acknowledge wrongdoing, and remain present until the issue receives appropriate attention.", "extra": [], "prayer": "Lord, give me courage to remain faithful in difficulty.", "refs": "James 1:19 · Philippians 2:4"}, {"title": "Always pursuing the next thing", "what": "New plans may crowd out meaningful connection and unfinished responsibilities.", "underneath": "Fear of missing out or feeling confined.", "response": "Practice contentment and give your spouse your attention without constantly seeking the next experience.", "extra": [], "prayer": "Teach me contentment and faithfulness today.", "refs": "Philippians 4:11–13"}], "parentGood": ["You can nurture joy, wonder, and gratitude.", "You can encourage creativity and exploration.", "You can help children see possibilities and approach challenges with hope."], "parentHard": [{"title": "Rushing past sadness", "what": "Children may feel pressured to become happy before their emotions have been heard.", "underneath": null, "response": "Listen compassionately and allow space for grief without abandoning hope.", "extra": [], "prayer": "Teach me to weep with those who weep.", "refs": "Romans 12:15 · John 11:35"}, {"title": "Inconsistent follow-through", "what": "Excitement about new experiences may interfere with promises and routines.", "underneath": null, "response": "Keep commitments and model perseverance in ordinary responsibilities.", "extra": [], "prayer": "Grow faithfulness and self-control in me.", "refs": "Galatians 5:22–23"}], "leaderGood": ["You can inspire optimism and initiative.", "You can identify opportunities.", "You can cultivate creativity and energy."], "leaderHard": [{"title": "Too many unfinished ideas", "what": "Frequent changes can create confusion, wasted effort, and instability.", "underneath": null, "response": "Count the cost, establish priorities, and finish what you responsibly commit to doing.", "extra": [], "prayer": "Teach me to plan wisely and follow through.", "refs": "Luke 14:28–30"}, {"title": "Avoiding hard conversations", "what": "You may postpone correction to preserve an upbeat atmosphere.", "underneath": null, "response": "Address problems promptly, truthfully, and lovingly.", "extra": [], "prayer": "Give me courage to speak truth in love.", "refs": "Ephesians 4:15"}], "lives": [{"who": "Peter", "sub": "Zeal, failure, and restoration", "text": "Peter responded boldly to Jesus, confessed Him as the Christ, and also resisted Jesus’ teaching about suffering. He later denied knowing Jesus and was restored by Him.", "lesson": "Enthusiasm is not a substitute for obedience. Christ calls us to faithfulness even when following Him is costly.", "refs": "Matthew 16:16–23 · Luke 22:54–62 · John 21:15–19", "woman": false}, {"who": "John Mark", "sub": "Departure and renewed usefulness", "text": "John Mark accompanied Paul and Barnabas but returned to Jerusalem during their journey. Scripture does not explain his reason. Paul later considered him useful for ministry.", "lesson": "A past failure or disagreement need not define someone’s future faithfulness.", "refs": "Acts 13:13 · 15:37–39 · 2 Timothy 4:11", "woman": false}, {"who": "Samson", "sub": "Strength without consistent obedience", "text": "God gave Samson extraordinary strength, yet Scripture records repeated destructive choices and serious moral failures.", "lesson": "Gifts and abilities never excuse disobedience. Strength without self-control can bring devastating consequences.", "refs": "Judges 13–16 · Hebrews 11:32", "woman": false}, {"who": "Miriam", "sub": "Worship and correction", "text": "Miriam led Israel’s women in celebration after the crossing of the sea. Later, she and Aaron spoke against Moses and were confronted by God.", "lesson": "Joyful worship and meaningful service must remain joined to humility and obedience.", "refs": "Exodus 15:20–21 · Numbers 12:1–15", "woman": true}]}, "8": {"n": 8, "name": "Challenger", "longs": "Independence, honesty, strength, and the ability to protect others.", "fear": "Betrayal, vulnerability, powerlessness, or unjust control.", "care": "Advocating, protecting, confronting problems, and taking responsibility.", "brings": "Courage, loyalty, decisiveness, and willingness to face difficult situations.", "blind": "Allowing strength to become domination, intimidation, anger, or resistance to correction.", "conflict": "Confront problems directly, speak forcefully, or expect others to respond with similar intensity.", "helps": "Honest communication, appropriate boundaries, and mutual accountability.", "stress": "Dishonesty, manipulation, powerlessness, and per del decisive action and conviction."], "parentHard": [{"title": "Using excessive force or intensity", "what": "Children may comply out of fear rather than learn wisdom and obedience.", "underneath": null, "response": "Correct with patience and self-control. Never confuse intimidation with godly authority.", "extra": [], "prayer": "Make me gentle and faithful in correction.", "refs": "Ephesians 6:4"}, {"title": "Controlling every decision", "what": "A desire to protect may prevent children from developing discernment.", "underneath": null, "response": "Provide appropriate boundaries while allowing age-appropriate responsibility.", "extra": [], "prayer": "Give me wisdom to guide without dominating.", "refs": "Colossians 3:21"}], "leaderGood": ["You can make difficult decisions.", "You can advocate for people treated unfairly.", "You can accept responsibility in challenging circumstances."], "leaderHard": [{"title": "Steamrolling others", "what": "Your intensity may discourage disagreement and prevent important concerns from being heard.", "underneath": null, "response": "Invite honest input, listen carefully, and exercise authority as a servant.", "extra": [], "prayer": "Make me quick to listen and humble in leadership.", "refs": "James 1:19 · Mark 10:42–45"}, {"title": "Refusing to acknowledge weakness", "what": "A need to appear strong may make it difficult to admit mistakes.", "underneath": null, "response": "Confess wrongdoing, receive correction, and model humility.", "extra": [], "prayer": "Give me courage to acknowledge my failures.", "refs": "Proverbs 28:13"}], "lives": [{"who": "Moses", "sub": "Leadership, humility, and disobedience", "text": "Moses confronted Pharaoh and led Israel, yet Scripture also records serious wrongdoing, including killing an Egyptian and disobeying God’s command at the rock.", "lesson": "Great responsibility requires humility and obedience. Authority does not place anyone beyond correction.", "refs": "Exodus 2:11–15 · Numbers 12:3 · ily conflict", "text": "Isaac repeatedly moved rather than fight over disputed wells. His family also experienced favoritism and deception.", "lesson": "Peacefulness is valuable, but family relationships require truthfulness and responsible leadership.", "refs": "Genesis 25:28 · 26:17–22 · 27", "woman": false}, {"who": "Eli", "sub": "The cost of failing to correct", "text": "Eli instructed Samuel in recognizing God’s call, but Scripture explicitly condemns his failure to restrain his sons.", "lesson": "Avoiding necessary correction can cause serious harm. Love and leadership require responsibility.", "refs": "1 Samuel 2:22–36 · 3:8–14", "woman": false}, {"who": "Abigail", "sub": "Courageous peacemaking", "text": "When her husband, Nabal, insulted David, David set out to take revenge. Abigail acted quickly, brought provisions, humbly appealed to David, and urged him not to take vengeance into his own hands. David blessed God for her good judgment. Afterward she told Nabal what had happened.", "lesson": "Biblical peacemaking is active and courageous. It turns people away from sin rather than simply avoiding conflict.", "refs": "1 Samuel 25:2–42", "woman": true}, {"who": "The wise woman of Abel", "sub": "Peace through wise words", "text": "When Joab besieged the city of Abel to capture Sheba, a man who had rebelled against King David, a wise woman called out to Joab and reasoned with him not to destroy a faithful city. She then persuaded the city to give up the rebel, and Joab withdrew.", "lesson": "Peacemaking may require speaking up, reasoning carefully, and dealing honestly with wrongdoing, so that many are spared.", "refs": "2 Samuel 20:14–22", "woman": true}]}}, "twoNote": "These prayers may rotate across spouse pairings. They are original, Scripture-inspired prayers, not quotations from the Bible.", "couple": [{"theme": "Love", "in": "Lord, clothe us in love.", "out": "Teach us to serve one another.", "refs": "Colossians 3:12–14"}, {"theme": "Humility", "in": "Give us humble hearts.", "out": "Help us consider one another.", "refs": "Philippians 2:3–4"}, {"theme": "Reconciliation", "in": "Make us truthful and gentle.", "out": "Lead us toward genuine peace.", "refs": "Ephesians 4:2–3, 15"}, {"theme": "Faithfulness", "in": "Teach us patient love.", "out": "Help us remain faithful.", "refs": "1 Corinthians 13:4–7"}, {"theme": "Marriage", "in": "Help us honor our covenant.", "out": "Teach us to love sacrificially.", "refs": "Genesis 2:24 · Ephesians 5:1–2"}], "pairing": {"same": ["You may recognize similar desires, tendencies, and struggles in one another. That familiarity can encourage understanding, but it may also mean sharing blind spots.", "Your shared personality patterns do not guarantee harmony. Christ calls both of you to humility, truthfulness, repentance, and sacrificial love."], "center": ["Within the Enneagram framework, your types belong to the same center: gut, heart, or head.", "This framework suggests that you may approach certain concerns in related ways, even when your responses differ. These categories are tools for reflection, not biblical identities or fixed psychological laws."], "different": ["You may approach decisions, emotions, and conflict differently. These differences can create misunderstandings, but they can also provide opportunities to practice patience, humility, and love.", "Your shared calling is not to become more alike in personality, but to grow in Christlike character."], "yada": {"paras": ["The Hebrew word yada broadly means “to know.” Depending on context, it can describe knowledge, recognition, or deeply personal relationship.", "Scripture calls believers to know God and to love one another sincerely. Understanding someone’s personality can support that love, but genuine love also requires truth, faithfulness, responsibility, and action."], "refs": "John 17:3 · 1 John 3:18"}}, "safety": ["Personality differences never justify intimidation, coercion, abuse, threats, exploitation, or dishonesty.", "Understanding why someone behaves a certain way does not remove their responsibility for that behavior.", "Forgiveness, reconciliation, and restored trust are related but distinct. Repentance requires more than words; it should produce meaningful change.", "No one is required to remain in an unsafe situation to demonstrate Christian love or submission.", "If you are experiencing relationship abuse in the United States, contact the National Domestic Violence Hotline at 1-800-799-7233 or text START to 88788.", "For suicide or mental health crises, call or text 988.", "If you are in immediate danger, call 911."], "work": {"note": "These principles apply regardless of Enneagram type.", "leader": {"paras": ["Authority is a responsibility entrusted for the good of others, not permission to dominate.", "Christ calls leaders toward humility, honesty, justice, self-control, and service."], "refs": "Mark 10:42–45 · Philippians 2:3–5"}, "employer": {"paras": ["Treat workers fairly. Communicate honestly, compensate justly, avoid favoritism, and exercise authority responsibly.", "Employees bear God’s image and must never be reduced to their usefulness or productivity."], "refs": "Colossians 4:1 · James 5:4 · James 2:1–9"}, "employee": {"paras": ["Work diligently and honestly. Receive appropriate correction, fulfill responsibilities, and communicate truthfully.", "Respect for authority does not require participating in wrongdoing or accepting abuse."], "refs": "Colossians 3:23–24 · Ephesians 4:25 · Acts 5:29"}, "calling": {"paras": ["Whatever our personality or position, we are called to love God and our neighbors.", "We do not measure righteousness by personality, productivity, popularity, authority, or personal comfort.", "We look to Jesus Christ, who calls us to follow Him."], "refs": "Matthew 22:37–40 · Luke 9:23"}}, "names": {"1": {"default": "Reformer", "options": [{"id": "reformer", "name": "Reformer", "about": "May identify with recognizing problems and wanting things to improve."}, {"id": "perfectionist", "name": "Perfectionist", "about": "May recognize high standards and close attention to mistakes."}, {"id": "idealist", "name": "Idealist", "about": "May emphasize principles and a picture of how things ought to be."}, {"id": "improver", "name": "Improver", "about": "May identify with refining processes, practices, or circumstances."}, {"id": "advocate", "name": "Advocate", "about": "May be drawn to standing up for principles or addressing perceived unfairness."}], "reflection": {"question": "Do my convictions lead me toward justice, mercy, and humility, or do I sometimes use them to elevate myself above others?", "refs": "Micah 6:8; Philippians 2:3–4"}}, "2": {"default": "Helper", "options": [{"id": "helper", "name": "Helper", "about": "May identify with offering practical assistance."}, {"id": "giver", "name": "Giver", "about": "May emphasize generosity and meeting others’ needs."}, {"id": "caregiver", "name": "Caregiver", "about": "May recognize attentiveness to another person’s well-being."}, {"id": "nurturer", "name": "Nurturer", "about": "May identify with encouragement and supportive relationships."}, {"id": "connector", "name": "Connector", "about": "May emphasize helping people build relationships and feel included."}], "reflection": {"question": "Am I loving others sincerely, or am I sometimes seeking approval, recognition, or influence through what I give?", "refs": "Philippians 2:3–4; 1 John 3:18"}}, "3": {"default": "Achiever", "options": [{"id": "achiever", "name": "Achiever", "about": "May identify with setting and accomplishing goals."}, {"id": "performer", "name": "Performer", "about": "May recognize attentiveness to presentation and expectations."}, {"id": "motivator", "name": "Motivator", "about": "May enjoy encouraging effort and progress."}, {"id": "striver", "name": "Striver", "about": "May identify with ambition, persistence, and hard work."}, {"id": "builder", "name": "Builder", "about": "May emphasize creating or developing something meaningful."}], "reflection": {"question": "Am I stewarding my abilities faithfully, or am I allowing achievement and recognition to become the basis of my worth?", "refs": "Philippians 3:7–9; Ephesians 2:8–10"}}, "4": {"default": "Individualist", "options": [{"id": "individualist", "name": "Individualist", "about": "May identify with personal distinctiveness."}, {"id": "romantic", "name": "Romantic", "about": "May emphasize emotional depth, meaning, and longing."}, {"id": "artist", "name": "Artist", "about": "May identify with creative or expressive interests."}, {"id": "creative", "name": "Creative", "about": "May recognize imagination and originality."}, {"id": "original", "name": "Original", "about": "May value expressing what feels authentic and personally meaningful."}], "reflection": {"question": "Am I honestly bringing my feelings and desires before God, while allowing His truth to guide how I respond?", "refs": "Psalm 139:23–24; Romans 12:2"}, "caution": "Grief, longing, and emotional depth are not inherently sinful."}, "5": {"default": "Investigator", "options": [{"id": "investigator", "name": "Investigator", "about": "May identify with researching and understanding."}, {"id": "observer", "name": "Observer", "about": "May prefer careful attention before acting."}, {"id": "thinker", "name": "Thinker", "about": "May recognize a reflective, analytical approach."}, {"id": "analyst", "name": "Analyst", "about": "May enjoy examining complex problems."}, {"id": "sage", "name": "Sage", "about": "May be drawn to the pursuit of wisdom and understanding; choosing this name does not establish that the person possesses biblical wisdom."}], "reflection": {"question": "Am I using what I know to love and serve others, or allowing knowledge to become a source of pride or distance?", "refs": "1 Corinthians 8:1; James 3:13–18"}}, "6": {"default": "Loyalist", "options": [{"id": "loyalist", "name": "Loyalist", "about": "May identify with ange your selections at any time."], "refs": "1 John 1:9; Titus 2:11–12; 1 Corinthians 10:13"}, "ownTitle": "Patterns sometimes associated with Type N", "ownNote": "These are possibilities to consider, not conclusions about you. Anyone can struggle with any of these.", "otherTitle": "Other patterns worth examining", "commonNote": "This catalog is not exhaustive. The Scripture passages establish biblical principles concerning the behavior, not the person’s personality type.", "responseQ": "Which best describes your experience?", "responses": ["I’m tempted toward this but trying to resist.", "I’ve acted on this and need to address it.", "This has been a struggle in the past.", "I want to understand this pattern better."], "items": [{"id": "resentment", "label": "Resentment", "desc": "Holding onto hostility or rehearsing offenses rather than responding truthfully and constructively.", "type": 1, "refs": null, "note": null}, {"id": "harsh-judgment", "label": "Harsh judgment", "desc": "Criticizing or condemning people without appropriate humility, mercy, or understanding.", "type": 1, "refs": null, "note": null}, {"id": "self-righteousness", "label": "Self-righteousness", "desc": "Treating one’s own conduct or standards as grounds for superiority over others.", "type": 1, "refs": null, "note": null}, {"id": "self-importance", "label": "Self-importance", "desc": "Beginning to believe others cannot manage without one’s involvement or that one’s helpfulness makes one superior.", "type": 2, "refs": null, "note": null}, {"id": "approval-seeking", "label": "Approval-seeking", "desc": "Allowing the desire for acceptance to encourage dishonesty, manipulation, or neglect of rightful responsibilities.", "type": 2, "refs": null, "note": null}, {"id": "giving-with-expectations", "label": "Giving with expectations", "desc": "Offering help or generosity while expecting affection, loyalty, recognition, or influence in return.", "type": 2, "refs": null, "note": null}, {"id": "image-management", "label": "Image management", "desc": "Misrepresenting reality or hiding the truth to maintain an admired appearance.", "type": 3, "refs": null, "note": null}, {"id": "overvaluing-achievement", "label": "Overvaluing achievement", "desc": "Treating accomplishment or recognition as the foundation of personal worth, potentially neglecting other responsibilities.", "type": 3, "refs": null, "note": null}, {"id": "selfish-ambition", "label": "Selfish ambition", "desc": "Pursuing advancement at another person’s expense.", "type": 3, "refs": null, "note": null}, {"id": "envy", "label": "Envy", "desc": "Resenting another person’s blessings, opportunities, or circumstances.", "type": 4, "refs": null, "note": "Lament, grief, and emotional pain are not automatically sinful."}, {"id": "self-focused-comparison", "label": "Self-focused comparison", "desc": "Allowing repeated comparison to cultivate resentment, superiority, or bitterness.", "type": 4, "refs": null, "note": "Lament, grief, and emotional pain are not automatically sinful."}, {"id": "treating-feelings-as-final-authority", "label": "Treating feelings as final authority", "desc": "Using emotions alone to justify choices without considering truth, wisdom, or moral responsibility.", "type": 4, "refs": null, "note": "Lament, grief, and emotional pain are not automatically sinful."}, {"id": "withholding-needed-support", "label": "Withholding needed support", "desc": "Refusing reasonable help, information, or care when one has a genuine responsibility and capacity to provide it.", "type": 5, "refs": null, "note": "Solitude, privacy, and limits on emotional energy are not inherently sinful."}, {"id": "avoiding-relational-responsibility", "label": "Avoiding relational responsibility", "desc": "Using withdrawal to evade necessary communication, accountability, or care.", "type": 5, "refs": null, "note": "Solitude, privacy, and limits on emotional energy are not inherently sinful."}, {"id": "intellectual-pride", "label": "Intellectual pride", "desc": "Treating knowledge or understanding as grounds for superiority.", "type": 5, "refs": null, "note": "Solitude, privacy, and limits on emotional energy are not inherently sinful."}, {"id": "unfounded-suspicion", "label": "Unfounded suspicion", "desc": "Making accusations or treating others unjustly without adequate evidence.", "type": 6, "refs": null, "note": "Caution, uncertainty, and appropriate distrust after wrongdoing are not automatically sinful."}, {"id": "fear-driven-avoidance", "label": "Fear-driven avoidance", "desc": "Allowing fear to lead to knowingly neglecting a rightful responsibility.", "type": 6, "refs": null, "note": "Caution, uncertainty, and appropriate distrust after wrongdoing are not automatically sinful."}, {"id": "shifting-blame", "label": "Shifting blame", "desc": "Refusing responsibility for one’s actions by placing fault on others.", "type": 6, "refs": null, "note": "Caution, uncertainty, and appropriate distrust after wrongdoing are not automatically sinful."}, {"id": "escaping-responsibility", "label": "Escaping responsibility", "desc": "Using distraction or new experiences to avoid obligations that need attention.", "type": 7, "refs": null, "note": "Enjoyment, recreation, and seeking new experiences are not inherently sinful.", "reflection": {"meaning": ["Sometimes we turn toward entertainment, activity, or new opportunities to avoid responsibilities that need our attention.", "Enjoying recreation or exploring new possibilities is not wrong. The concern is knowingly neglecting what we ought to do."], "scripture": ["Ephesians 5:15–17 calls believers to live wisely and make good use of their time, seeking to understand the Lord’s will.", "This passage does not prohibit recreation. It calls for wisdom and intentional living."], "read": "Ephesians 5:15–17", "heart": "Is there a responsibility I have been avoiding because something else feels easier or more enjoyable?", "prayer": "Father, thank You for the good // The final round adjusts the statement averages; it never replaces them.
// A finalist can only overtake another if they were already close.
function duelTally(s) {
  const wins = {}, losses = {}; TYPES.forEach((t) => { wins[t] = 0; losses[t] = 0; });
  for (const [key, res] of Object.entries(s.duel)) { const [a, b] = key.split("-").map(Number);

  return [...finalists].sort((a, b) => final[b] - final[a] || r[b].avg - r[a].avg || a - b);
}

function outcome(s) {
  const p = plan(s), r = stats(s.ans), { wins, losses } = duelTally(s);

}

// Tester results: everything needed to rerun the finder, in one line of text.
const ALLKEYS = [
  ...TYPES.flatMap((t) => BANK[t].map((_, k) => `${t}.${k}`)),
  ...Object.keys(TIE).flatMap((p) => TIE[p].map((_, i) => `x:${p}:${i}`)),
  ...TYPES.flatMap((t) => WING[t].map((_, k) => `w:${t}:${k}`)),

const DUELCODE = { a: "a", b: "b", both: "=", neither: "0" }, DUELBACK = { a: "a", b: "b", "=": "both", "0": "neither" };
function resultsCode(s) {
  const raw = ALLKEYS.map((k) => k in s.ans ? String(s.ans[k]) : ".").join("").replace(/\.+/g, (m) => m.length > 2 ? `_${m.length.toString(36)}_` : m);
  const duels = Object.entries(s.duel).filter(([, v]) => v.length).map(([k, v]) => k.replace("-", "") + v.map((x) => DUELCODE[x]).join("")).join(",");
  return ["YADA1", encodeURIComponent(s.tname.trim()), `${s.guess || 0}${s.sure || 0}${s.feel || 0}`, raw, duels, encodeURIComponent(s.note.trim()), s.length || 0, `${s.married || 0}${s.kids || 0}${s.gender || 0}${(s.explore || []).map((k) => Object.keys(EXPLORE_LABELS).indexOf(k) + 1).join("")}`, `${s.prefName === "default" ? "d" : s.prefName === "unsure" ? "u" : s.prefName ? Math.max(0, NAMES[outcome(s).order[0]].options.findIndex((o) => o.id === s.prefName)) : 0}${s.prefReason || 0}`].join("|");
}
function readResults(code) {
  const parts = code.trim().split("|"); if (parts[0] !== "YADA1" || parts.length < 6) return null;
  try {
    const raw = parts[3].replace(/_([0-9a-z]+)_/g, (_, n) => ".".repeat(parseInt(n, 36)));
    if (raw.length !== ALLKEYS.length) return null;
    const ans = {}; ALLKEYS.forEach((k, i) => { if (raw[i] !== ".") ans[k] = Number(raw[i]); });
    const duel = {}; parts[4].split(",").filter(Boolean).forEach((d) => { duel[`${d[0]}-${d[1]}`] = d.slice(2).split("").map((x) => DUELBACK[x]); });
    const [guess, sure, feel] = parts[2].split("").map(Number);
    return { name: decodeURIComponent(parts[1]) || "Anonymous", guess, sure, feel, note: decodeURIComponent(parts[5]), length: Number(parts[6]) || 0, ...(() => { const a = (parts[7] || "").split(""), clean = (v) => v && v !== "0" ? v : ""; return { married: clean(a[0]), kids: clean(a[1]), gender: clean(a[2]), explore: a.slice(3).map((i) => Object.keys(EXPLORE_LABELS)[Number(i) - 1]).filter(Boolean) }; })(), prefCode: parts[8] || "", ans, duel };
  } catch { return null; }
}

// The organizer's view: paste the codes testers sent back.
let inbox = (() => { try { return localStorage.getItem(KEY + "-inbox") || ""; } catch { return ""; } })();
function inboxView() {
  const rows = (inbox.match(/YADA1\|\S+/g) || []).map((line) => ({ line, r: readResults(line) }));
  const good = rows.filter((x) => x.r).map(({ r }) => {
    const s = { ans: r.ans, duel: r.duel }, o = outcome(s), first = o.order[0], top = o.order.slice(0, 3), wr = wingRead(s, first);
    const avgs = TYPES.map((t) => o.r[t].avg), flat = Math.max(...avgs) - Math.min(...avgs) < 1;
    return { ...r, first, top, flat, wr, count: Object.keys(r.ans).length + Object.values(r.duel).flat().length };
  });
  const bad = rows.filter((x) => !x.r).length;

    <p class="muted">Felt right: ${[4, 3, 2, 1].map((f) => `${FEEL[f]} ${good.filter((g) => g.feel === f).length}`).join(" \u00b7 ")}</p>

  const { flat, first, runners } = shareSummary(), FEEL = ["", "Not at all", "Partly", "Mostly", "Spot on"], SURE = ["", "just a guess", "fairly sure", "very sure"];
  const name = st.tname.trim() || "Anonymous", note = st.note.trim();
  btn.disabled = true; status.textContent = "Sending\u2026";
  fetch("https://api.web3forms.com/submit", {
    method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      access_key: FEEDBACK_KEY, from_name: "Yada type finder", botcheck: "",
      subject: `Yada tester: ${name} \u2013 ${flat ? "no clear type" : `Type ${first}`}${st.feel ? `, feels ${FEEL[st.feel].toLowerCase()}` : ""}`,
      "Tester": name,
      "Result": flat ? "No type stood out yet" : `Type ${first}, ${T[first].name} (also possible: ${runners.join(" and ")})`,
      "How well does it fit?": FEEL[st.feel] || "(not answered)",
      "Length": LENGTH[st.length] || "(not answered)",
      "About them": aboutText(st) || "(not answered)",
      "Wants to explore": exploreText(st) || "(not answered)",
      "Name they resonate with": prefText(st) || "(not chosen)",
      "Feedback": note || "(none)",
      "Thought their type was": Number(st.guess) ? `${st.guess}, ${T[st.guess].name}${st.sure ? ` (${SURE[st.sure]})` : ""}` : st.guess === "0" ? "No idea" : "(not answered)",
      "Answers": String(st.history.length),
      "Results code (paste into #results)": resultsCode(st),
    }),
  }).then((r) => r.json()).then((d) => {
    if (!d.success) throw new Error(d.message);
    st.sentAt = new Date().toISOString(); save();
    btn.disabled = false; btn.textContent = "Send an update"; status.textContent = "Sent. Thank you! If you change anything, you can send an update.";
  }).catch(() => { btn.disabled = false; status.textContent = "Couldn't send just now. Check your connection and try again, or tap Share my results instead."; });
}
// Invite someone to take the finder: just the link and a line about it, never the sender's results.
const FRIEND_INVITE = "I just found out what drives me. Take this and we can compare. It's a 5–10 minute Christ-centered Enneagram test:";
function inviteFriend(statusId = "invited") {
  const status = document.getElementById(statusId);
  const copy = () => navigator.clipboard.writeText(`${FRIEND_INVITE} ${SHARE_URL}`)
    .then(() => { status.textContent = "Link copied. Paste it into a text or email."; })
    .catch(() => { status.textContent = "Here's the link to send:"; status.insertAdjacentHTML("afterend", `<code class="share">${h(SHARE_URL)}</code>`); });
  if (!navigator.share) return copy();
  navigator.share({ title: "Yada type finder", text: FRIEND_INVITE, url: SHARE_URL }).catch((e) => { if (e.name !== "AbortError") copy(); });
}
// Feedback reminders: a floating bar once they're partway through, and a nudge if they share without any.
const hasFeedback = () => !!(st.feel || st.note.trim() || st.sentAt);
function updateFeedbackBar() {
  const bar = document.getElementById("fbbar"), box = document.getElementById("sendpanel");
  if (!bar || !box) return;
  const read = (scrollY + innerHeight) / document.documentElement.scrollHeight;
  bar.hidden = hasFeedback() || read < 0.4 || box.getBoundingClientRect().top < innerHeight;
}
function goToFeedback() {
  const box = document.getElementById("sendpanel"); if (!box) return;
  box.scrollIntoView({ behavior: "smooth", block: "start" });
  setTimeout(() => document.getElementById("feel")?.focus({ preventScroll: true }), 500);
}
function shareResults(statusId, skipNudge) {
  if (statusId === "shared" && !skipNudge && !hasFeedback() && !st.noFeedback) {
    const n = document.getElementById("sharenudge"); n.hidden = false; n.scrollIntoView({ behavior: "smooth", block: "nearest" }); return;
  }
  const status = document.getElementById(statusId), text = shareMessage();
  let file = null; try { if (window.jspdf?.jsPDF) file = resultsPdf(); } catch {}
  const saveFile = () => { if (!file) return false; const a = document.createElement("a"); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click(); a.remove(); return true; };
  const copy = () => { const saved = saveFile(); navigator.clipboard.writeText(text)
    .then(() => { status.textContent = saved ? "Saved your results as a PDF and copied a message to send with it." : "Copied. Paste it into a text or email."; })
    .catch(() => { status.textContent = "Couldn't share here. Here's the message:"; status.insertAdjacentHTML("afterend", `<code class="share">${h(text)}</code>`); }); };
  if (!navigator.share) return copy();
  const data = file && navigator.canShare?.({ files: [file] }) ? { files: [file], title: "My Yada results", text } : { title: "My Yada results", text };
  navigator.share(data).catch((e) => { if (e.name !== "AbortError") copy(); });
}

function wire() {
  const $ = (s) => document.querySelector(s), on = (s, f) => { const el = $(s); if (el) el.onclick = f; };
  if ($("#shareresults")) loadPdfLib();
  on("#shareresults", () => shareResults("shared"));
  on("#shareresults2", () => shareResults("copiedresults"));
  on("#sendteam", sendToTeam);
  if ($("#nofeedback")) $("#nofeedback").onchange = (e) => set({ noFeedback: e.target.checked });
  on("#printresults", () => window.print());
  on("#invitefriend", () => inviteFriend());
  on("#invitefriend2", () => inviteFriend("invited2"));
  document.querySelectorAll("[data-gorel]").forEach((b) => b.onclick = () => { st.rel = b.dataset.gorel; save(); location.hash = "people"; window.scrollTo(0, 0); });
  on("#toparent", () => { location.hash = "parent"; window.scrollTo(0, 0); });
  document.querySelectorAll("[data-prefname]").forEach((b) => b.onclick = () => { const clear = st.prefName === b.dataset.prefname; set({ prefName: clear ? "" : b.dataset.prefname, prefReason: clear || b.dataset.prefname === "unsure" ? "" : st.prefReason, prefNameAt: new Date().toISOString() }); });
  document.querySelectorAll("[data-prefreason]").forEach((b) => b.onclick = () => set({ prefReason: st.prefReason === b.dataset.prefreason ? "" : b.dataset.prefreason }));
  document.querySelectorAll("[data-tempt]").forEach((b) => b.onclick = () => { const id = b.dataset.tempt; id in privState().picks ? delete privState().picks[id] : (privState().picks[id] = ""); savePriv(); render(); });
  document.querySelectorAll("[data-tresp]").forEach((b) => b.onclick = () => { const id = b.dataset.tresp, v = b.dataset.trespval; privState().picks[id] = privState().picks[id] === v ? "" : v; savePriv(); render(); });
  on("#clearpriv", () => { privCache = { picks: {} }; try { localStorage.removeItem(pkey()); } catch {} render(); });
  const lifeAt = (row) => { const cards = [...row.children]; let best = 0; cards.forEach((c, i) => { if (Math.abs(c.offsetLeft - row.offsetLeft - row.scrollLeft) < Math.abs(cards[best].offsetLeft - row.offsetLeft - row.scrollLeft)) best = i; }); return row.scrollLeft + row.clientWidth >= row.scrollWidth - 4 ? cards.length - 1 : best; };
  const lifeCount = (n, i) => { const row = $(`[data-liferow="${n}"]`); $(`[data-lifecount="${n}"]`).textContent = `${i + 1} of ${row.children.length}`; };
  document.querySelectorAll("[data-liferow]").forEach((row) => { row.onscroll = () => { if (Date.now() - (row._go || 0) > 700) { row._i = lifeAt(row); lifeCount(row.dataset.liferow, row._i); } }; });
  document.querySelectorAll("[data-lifego]").forEach((b) => b.onclick = () => {
    const n = b.dataset.lifego, row = $(`[data-liferow="${n}"]`), cards = row.children;
    const i = Math.max(0, Math.min(cards.length - 1, (row._i ?? lifeAt(row)) + Number(b.dataset.dir)));
    row._i = i; row._go = Date.now(); row.scrollTo({ left: cards[i].offsetLeft - row.offsetLeft, behavior: "smooth" }); lifeCount(n, i);
  });
  on("#toleader", () => { location.hash = "leader"; window.scrollTo(0, 0); });
  document.querySelectorAll("[data-about]").forEach((b) => b.onclick = () => set({ [b.dataset.about]: st[b.dataset.about] === b.dataset.aboutval ? "" : b.dataset.aboutval }));
  document.querySelectorAll("[data-explore]").forEach((b) => b.onclick = () => { const e = new Set(st.explore || []); e.has(b.dataset.explore) ? e.delete(b.dataset.explore) : e.add(b.dataset.explore); set({ explore: [...e] }); });
  document.querySelectorAll("[data-rel]").forEach((b) => b.onclick = () => set({ rel: b.dataset.rel }));
  document.querySelectorAll("[data-reltype]").forEach((b) => b.onclick = () => set({ relType: b.dataset.reltype }));
  if ($("#relname")) $("#relname").onchange = (e) => set({ relName: e.target.value });
  on("#tofeedback", goToFeedback);
  on("#fbbarbtn", goToFeedback);
  on("#nudgeadd", () => { $("#sharenudge").hidden = true; goToFeedback(); });
  on("#nudgeskip", () => { $("#sharenudge").hidden = true; shareResults("shared", true); });
  updateFeedbackBar();
  document.querySelectorAll("[data-mode]").forEach((b) => b.onclick = () => set({ mode: b.dataset.mode }));
  if ($("#about")) $("#about").oninput = (e) => { st.about = e.target.value; save(); };
  if ($("#guess")) $("#guess").onchange = (e) => set({ guess: e.target.value, sure: Number(e.target.value) ? st.sure : "" });
  on("#start", () => { set({ step: st.read ? "quiz" : "read" }); window.scrollTo(0, 0); });
  on("#ack", () => { set({ read: true, step: "quiz" }); window.scrollTo(0, 0); });
  on("#readback", () => { set({ step: "intro" }); window.scrollTo(0, 0); });
  on("#reset", () => { st = fresh(); save(); render(); });
  on("#restart", () => { st = fresh(); save(); render(); window.scrollTo(0, 0); });
  on("#back", undo);
  document.querySelectorAll("[data-v]").forEach((b) => b.onclick = () => {
    const p = plan(st); st.ans = { ...st.ans, [p.key]: Number(b.dataset.v) }; answer({ s: p.key });
  });
  document.querySelectorAll("[data-duel]").forEach((b) => b.onclick = () => {
    const p = plan(st); st.duel = { ...st.duel, [p.key]: [...(st.duel[p.key] || []), b.dataset.duel] }; answer({ d: p.key });
  });
  if ($("#translation")) $("#translation").onchange = (e) => set({ translation: e.target.value });
  if ($("#sure")) $("#sure").onchange = (e) => set({ sure: e.target.value });
  for (const id of ["tname", "note"]) if ($("#" + id)) $("#" + id).oninput = (e) => { st[id] = e.target.value; save(); };
  if ($("#feel")) $("#feel").onchange = (e) => { st.feel = e.target.value; save(); updateFeedbackBar(); };
  if ($("#length")) $("#length").onchange = (e) => { st.length = e.target.value; save(); };
  if ($("#inbox")) $("#inbox").oninput = (e) => { inbox = e.target.value; try { localStorage.setItem(KEY + "-inbox", inbox); } catch {} };
  on("#tally", () => render());
  on("#seeresults", () => { location.hash = "results"; window.scrollTo(0, 0); });
  on("#copyinvite", () => {
    navigator.clipboard.writeText(INVITE).then(() => { $("#invitecopied").textContent = "Copied. Paste it into a text or email."; })
      .catch(() => { $("#invitecopied").textContent = "Couldn't copy here. Here's the message:"; $("#invitecopied").insertAdjacentHTML("afterend", `<code class="share">${h(INVITE)}</code>`); });
  });
  on("#toabout", () => { location.hash = "about"; window.scrollTo(0, 0); });
  on("#seeothers", () => { const m = $("#moreppl"), b = $("#seeothers"); m.hidden = !m.hidden; b.textContent = m.hidden ? "See others" : "Show fewer"; b.setAttribute("aria-expanded", String(!m.hidden)); });
  on("#tobible", () => { location.hash = "bible"; window.scrollTo(0, 0); });
  on("#toquiz", () => { history.replaceState(null, "", location.pathname); render(); });
}

window.addEventListener("hashchange", render);
window.addEventListener("scroll", updateFeedbackBar, { passive: true });
render();
</script>
